<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基本情報技術者ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: 試験端末のような1カラム。上に固定タブ、本文は最大760px。等幅書体は数字・コード・ラベル専用 */
:root{
  --bg:#edf0f4; --surface:#ffffff; --sunk:#e3e8ee; --ink:#141d28; --muted:#566475; --line:#cfd7e0;
  --accent:#2347c5; --accent-ink:#ffffff; --accent-soft:#e2e8fb;
  --good:#16794a; --good-soft:#dff3e8; --bad:#bd3526; --bad-soft:#fbe4e0; --warn:#96650b; --warn-soft:#fbf0d6;
  --body:"IBM Plex Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f141a; --surface:#182029; --sunk:#111820; --ink:#e7ecf2; --muted:#93a1b1; --line:#2b3644;
    --accent:#8ea8ff; --accent-ink:#0d1430; --accent-soft:#1d2848;
    --good:#55c892; --good-soft:#12301f; --bad:#f2806f; --bad-soft:#3a1915; --warn:#e2b458; --warn-soft:#33270d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141a; --surface:#182029; --sunk:#111820; --ink:#e7ecf2; --muted:#93a1b1; --line:#2b3644;
  --accent:#8ea8ff; --accent-ink:#0d1430; --accent-soft:#1d2848;
  --good:#55c892; --good-soft:#12301f; --bad:#f2806f; --bad-soft:#3a1915; --warn:#e2b458; --warn-soft:#33270d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-size:17px;letter-spacing:.02em}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.grp{display:flex;flex-direction:column;gap:6px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.grp-h span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:100%}
.cat:hover{border-color:var(--accent)}
.cat .nm{font-weight:500}
.cat .ct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .ok{background:var(--good)} .bar .ng{background:var(--bad)}
.facts{display:grid;grid-template-columns:auto 1fr 1fr;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:14px}
.facts>div{padding:8px 12px;border-bottom:1px solid var(--line)}
.facts>div:nth-last-child(-n+3){border-bottom:0}
.facts .h{background:var(--sunk);font-weight:700;font-size:13px}
.facts .k{color:var(--muted);font-size:13px}
.notice{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:6px;padding:10px 14px;font-size:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:2px 10px}
.prog{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.timer{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:2px 10px;background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qtext{white-space:pre-line;font-size:16px}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.65;overflow-x:auto;white-space:pre;tab-size:2}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;white-space:pre-line}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .lb{font-family:var(--mono);font-weight:600;color:var(--muted)}
.opt .mk{font-size:13px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .mk{color:var(--good)}
.opt.ng{border-color:var(--bad);background:var(--bad-soft)} .opt.ng .mk{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.opt.codey .tx{font-family:var(--mono);font-size:14px}
.exp{border-left:4px solid var(--accent);background:var(--sunk);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;white-space:pre-line}
.exp b.v-ok{color:var(--good)} .exp b.v-ng{color:var(--bad)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
summary{padding:10px 14px;cursor:pointer;font-weight:500}
details>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:72px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.grid button{width:36px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mono);font-size:13px}
.grid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.grid button.cur{outline:2px solid var(--accent)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--mono);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pill{font-size:13px;font-weight:700;border-radius:99px;padding:3px 12px}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.ng{background:var(--bad-soft);color:var(--bad)}
.rv summary{display:grid;grid-template-columns:auto 1fr;gap:10px}
.rv summary .m{font-weight:700;font-family:var(--mono)}
.rv .m.ok{color:var(--good)} .rv .m.ng{color:var(--bad)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.note .f{font-family:var(--mono);font-size:13.5px;background:var(--sunk);border-radius:6px;padding:6px 10px;overflow-x:auto;white-space:pre}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.prog i,.bar i{transition:width .25s}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>基本情報技術者ドリル</b><span>FE / 科目A・科目B</span></div>
  <nav class="tabs" id="tabs" aria-label="画面切り替え"></nav>
</div></header>
<main id="app"></main>
<script>
"use strict";
/* ========== 分野 ========== */
const CATS=[
 {k:'kiso',n:'基礎理論',g:'テクノロジ系',s:'A'},
 {k:'algo',n:'アルゴリズムとデータ構造',g:'テクノロジ系',s:'A'},
 {k:'hw',n:'コンピュータ構成要素',g:'テクノロジ系',s:'A'},
 {k:'sys',n:'システム構成要素',g:'テクノロジ系',s:'A'},
 {k:'sw',n:'ソフトウェア',g:'テクノロジ系',s:'A'},
 {k:'db',n:'データベース',g:'テクノロジ系',s:'A'},
 {k:'nw',n:'ネットワーク',g:'テクノロジ系',s:'A'},
 {k:'sec',n:'セキュリティ',g:'テクノロジ系',s:'A'},
 {k:'dev',n:'開発技術',g:'マネジメント系',s:'A'},
 {k:'pm',n:'プロジェクトマネジメント',g:'マネジメント系',s:'A'},
 {k:'sm',n:'サービスマネジメント・監査',g:'マネジメント系',s:'A'},
 {k:'st',n:'システム戦略',g:'ストラテジ系',s:'A'},
 {k:'biz',n:'経営戦略・企業活動',g:'ストラテジ系',s:'A'},
 {k:'law',n:'法務',g:'ストラテジ系',s:'A'},
 {k:'bal',n:'アルゴリズムとプログラミング',g:'科目B',s:'B'},
 {k:'bsec',n:'情報セキュリティ',g:'科目B',s:'B'}
];
const GROUPS=['テクノロジ系','マネジメント系','ストラテジ系','科目B'];
const catOf=k=>CATS.find(c=>c.k===k);

/* ========== 問題（選択肢の先頭が正解。表示時に並べ替える） ========== */
const Q=[]; const _n={};
function q(c,text,o,e,code){_n[c]=(_n[c]||0)+1;Q.push({id:c+_n[c],c,q:text,o,e,code:code||null});}

// --- 基礎理論
q('kiso','10進数の 0.625 を2進数で表したものはどれか。',['0.101','0.11','0.011','0.111'],'0.625 = 0.5 + 0.125 = 2⁻¹ + 2⁻³ なので 0.101。2倍して整数部を順に取り出す方法（1.25→1、0.5→0、1.0→1）でも求められる。');
q('kiso','8ビットの2の補数表現で、10進数の −20 を表したものはどれか。',['11101100','11101011','10010100','11101101'],'20 = 00010100。全ビットを反転して 11101011、これに 1 を足して 11101100。反転だけで止めると1の補数になる。');
q('kiso','16進数の 2F を10進数で表したものはどれか。',['47','45','46','57'],'2×16 + 15 = 47。F は 15。');
q('kiso','論理式 A・(A＋B) と常に同じ値になるものはどれか。ここで、・は論理積、＋は論理和を表す。',['A','B','A＋B','A・B'],'吸収則。A が 0 なら全体は 0、A が 1 なら (A＋B) は 1 なので全体は 1。B に関係なく A と一致する。');
q('kiso','二つの入力がともに 1 のとき、またはともに 0 のときに 0 を出力し、一方だけが 1 のときに 1 を出力する論理演算はどれか。',['排他的論理和（XOR）','論理和（OR）','論理積（AND）','否定論理積（NAND）'],'入力が異なるときだけ 1 になるのが排他的論理和。OR は両方 1 でも 1、NAND は両方 1 のときだけ 0 になる。');
q('kiso','二つのサイコロを同時に振ったとき、出た目の和が 8 になる確率はどれか。',['5/36','1/6','1/9','7/36'],'全36通りのうち、和が8になるのは (2,6)(3,5)(4,4)(5,3)(6,2) の5通り。');
q('kiso','式 (A＋B)×(C−D) を逆ポーランド記法（後置記法）で表したものはどれか。',['AB＋CD−×','ABC＋D−×','AB＋C×D−','ABCD＋×−'],'演算子を被演算子の後ろに置く。A＋B → AB＋、C−D → CD−、その二つを掛けるので AB＋CD−×。');
q('kiso','浮動小数点演算で、絶対値が非常に大きい数と非常に小さい数を加減算したとき、小さい数が結果に反映されなくなる現象はどれか。',['情報落ち','桁落ち','丸め誤差','打切り誤差'],'情報落ちは桁合わせで小さい数の有効桁が失われる現象。桁落ちは値がほぼ等しい数どうしの減算で有効桁数が減る現象。');
q('kiso','音声を標本化周波数 8kHz、量子化ビット数 8 ビットでディジタル化する。1秒間のデータ量は何ビットか。圧縮は行わない。',['64,000','8,000','16,000','128,000'],'1秒間に 8,000 回標本化し、1回につき 8 ビットで記録するので 8,000×8 = 64,000 ビット。');
q('kiso','機械学習のうち、正解が付けられたデータを使ってモデルを学習させ、未知のデータの分類や予測を行う手法はどれか。',['教師あり学習','教師なし学習','強化学習','クラスタリング'],'正解ラベル付きデータで学習するのが教師あり学習。教師なし学習は正解なしで構造を見つける（クラスタリングはその代表）。強化学習は報酬を最大化する行動を試行錯誤で学ぶ。');

// --- アルゴリズムとデータ構造
q('algo','空のスタックに対して PUSH 1, PUSH 2, POP, PUSH 3, PUSH 4, POP, POP の順に操作した。POP で取り出される値を順に並べたものはどれか。',['2, 4, 3','1, 2, 3','2, 3, 4','1, 3, 4'],'スタックは後入れ先出し。1,2 を積んで POP→2。3,4 を積んで POP→4、POP→3。スタックには 1 が残る。');
q('algo','先に格納したデータから順に取り出す、先入れ先出し（FIFO）のデータ構造はどれか。',['キュー','スタック','2分木','ハッシュ表'],'キューは待ち行列で FIFO。スタックは後入れ先出し（LIFO）。');
q('algo','昇順に整列された 1,000 個の要素をもつ配列を2分探索する。探索が終わるまでの比較回数は最大で約何回か。',['10','9','100','500'],'2分探索は1回の比較で探索範囲が半分になる。2¹⁰ = 1,024 ≧ 1,000 なので、最大でも約10回。');
q('algo','クイックソートの説明として適切なものはどれか。',['基準値を選び、それより小さい要素の組と大きい要素の組に分け、それぞれに同じ操作を繰り返す。','隣り合う要素を比較し、大小関係が逆であれば交換する操作を繰り返す。','未整列部分から最小値を選び、未整列部分の先頭と交換する操作を繰り返す。','整列済みの部分に、未整列の要素を一つずつ適切な位置へ挿入する操作を繰り返す。'],'基準値（ピボット）による分割を再帰的に行うのがクイックソート。ほかは順にバブルソート、選択ソート、挿入ソートの説明。');
q('algo','n 個のデータをバブルソートで整列するときの、平均的な計算量のオーダーはどれか。',['O(n²)','O(n)','O(n log n)','O(log n)'],'バブルソートは隣接要素の比較を約 n²/2 回行うので O(n²)。クイックソートやマージソートの平均は O(n log n)。');
q('algo','ハッシュ法による探索で、異なるキーから同じハッシュ値が得られることを何というか。',['衝突（シノニムの発生）','オーバフロー','フラグメンテーション','デッドロック'],'異なるキーが同じ格納位置になることを衝突といい、衝突したレコードをシノニムと呼ぶ。チェイン法やオープンアドレス法で対処する。');
q('algo','関数 f(n) を次のように定義する。f(5) の値はどれか。\nn ≦ 1 のとき f(n) = 1\nn > 1 のとき f(n) = n × f(n−1)',['120','24','60','720'],'階乗の再帰的定義。f(5) = 5×4×3×2×1 = 120。');

// --- コンピュータ構成要素
q('hw','クロック周波数が 2GHz の CPU で、1命令の実行に平均 4 クロックを要する。この CPU の性能は約何 MIPS か。',['500','125','800','8,000'],'1秒間に 2×10⁹ クロック ÷ 4 = 5×10⁸ 命令。MIPS は100万命令/秒の単位なので 500 MIPS。');
q('hw','キャッシュメモリのアクセス時間が 10 ナノ秒、主記憶のアクセス時間が 100 ナノ秒、キャッシュのヒット率が 0.9 のとき、実効アクセス時間は何ナノ秒か。',['19','55','91','109'],'10×0.9 + 100×(1−0.9) = 9 + 10 = 19 ナノ秒。ヒット率を逆に掛けると 91 になる。');
q('hw','CPU のパイプライン制御の説明として適切なものはどれか。',['命令の処理を複数の段階に分け、複数の命令を1段階ずつずらしながら並行して実行する。','複数の CPU コアに別々のプログラムを割り当てて同時に実行する。','主記憶の容量を補うために、補助記憶を使って見かけの記憶空間を広げる。','使用頻度の高いデータを高速な記憶装置に置き、平均アクセス時間を短くする。'],'パイプラインは命令の取出し・解読・実行などの段階を流れ作業のように重ねて実行する方式。ほかは順にマルチコア、仮想記憶、キャッシュの説明。');
q('hw','2台のディスクに同じデータを書き込むことで信頼性を高める RAID のレベルはどれか。',['RAID 1','RAID 0','RAID 5','RAID 3'],'RAID 1 はミラーリング。RAID 0 はストライピングで冗長性なし。RAID 5 はデータとパリティを複数ディスクに分散して記録する。');
q('hw','コンデンサに蓄えた電荷で情報を記憶し、内容を保持するために定期的なリフレッシュ動作が必要なメモリはどれか。',['DRAM','SRAM','フラッシュメモリ','マスク ROM'],'DRAM は電荷が時間とともに抜けるためリフレッシュが必要。主記憶に使われる。SRAM はフリップフロップで記憶しリフレッシュ不要、キャッシュに使われる。');
q('hw','割込みのうち、外部割込みに分類されるものはどれか。',['入出力装置の動作完了による割込み','ゼロによる除算で発生する割込み','ページフォールトによる割込み','スーパバイザコール（SVC）による割込み'],'外部割込みは実行中のプログラム以外の要因（入出力完了、タイマ、ハードウェア障害など）で起こる。ゼロ除算、ページフォールト、SVC は実行中のプログラムが原因の内部割込み。');

// --- システム構成要素
q('sys','MTBF が 480 時間、MTTR が 20 時間のシステムの稼働率はどれか。',['0.96','0.04','0.92','0.98'],'稼働率 = MTBF ÷ (MTBF＋MTTR) = 480 ÷ 500 = 0.96。');
q('sys','稼働率が 0.9 の装置を2台並列に接続し、少なくとも1台が動作していればよいシステムの稼働率はどれか。',['0.99','0.81','0.90','0.95'],'並列は 1 −(1−0.9)² = 1 − 0.01 = 0.99。直列（両方とも必要）なら 0.9×0.9 = 0.81。');
q('sys','フェールセーフの考え方に基づく設計はどれか。',['信号機の制御装置が故障したとき、全ての信号を赤にして停止させる。','一部の装置が故障しても、機能を縮小して運転を続ける。','利用者が誤った操作をしても、システムが誤動作しないようにする。','装置を二重化し、一方が故障しても全機能を維持する。'],'フェールセーフは故障時に安全な側へ動作させる考え方。ほかは順にフェールソフト、フールプルーフ、フォールトトレラントの例。');
q('sys','サーバの台数を増やして処理を分散し、システム全体の処理能力を高めることを何というか。',['スケールアウト','スケールアップ','スケールイン','フェールオーバ'],'台数を増やすのがスケールアウト、1台の性能（CPU やメモリ）を上げるのがスケールアップ。スケールインは台数を減らすこと。');
q('sys','システムの性能評価で使うスループットの説明はどれか。',['単位時間当たりに処理できる仕事の量','処理を依頼してから全ての結果を受け取るまでの時間','処理を依頼し終えてから最初の応答が返り始めるまでの時間','システムが正常に稼働している時間の割合'],'スループットは単位時間当たりの処理量。ほかは順にターンアラウンドタイム、レスポンスタイム、稼働率。');
q('sys','コンテナ型仮想化の説明として適切なものはどれか。',['ホスト OS のカーネルを共有し、アプリケーションの実行環境をプロセスとして分離する。','ハードウェア上で直接動く制御プログラムの上で、複数のゲスト OS を動かす。','1台のサーバの障害時に、待機系のサーバへ処理を引き継ぐ。','サーバの画面を端末に転送し、端末側にはデータを残さない。'],'コンテナはゲスト OS を持たず、ホスト OS のカーネルを共有するため軽量で起動が速い。2番目はハイパーバイザ型の説明。');

q('sw','タスクスケジューリング方式のうち、ラウンドロビン方式の説明はどれか。',['実行可能待ち行列の先頭のタスクから順に、一定時間ずつ CPU を割り当てる。','優先度が最も高いタスクに CPU を割り当てる。','処理時間が最も短いと予測されるタスクから実行する。','到着した順に、タスクが終了するまで CPU を割り当て続ける。'],'ラウンドロビンは一定時間（タイムクウォンタム）を使い切ると待ち行列の末尾に回す方式。ほかは優先度順、処理時間順、到着順の説明。');
q('sw','デッドロックの説明として適切なものはどれか。',['複数のタスクが互いに相手の占有する資源の解放を待ち続け、どのタスクも処理を進められなくなる。','優先度の低いタスクに、いつまでも CPU が割り当てられない。','主記憶の空き領域が細かく分かれ、まとまった領域を確保できなくなる。','ページの置換えが多発し、処理効率が極端に下がる。'],'互いに待ち合って進めなくなるのがデッドロック。資源を獲得する順序をそろえると防げる。ほかは順にスタベーション、フラグメンテーション、スラッシング。');
q('sw','仮想記憶のページ置換えアルゴリズムである LRU の説明はどれか。',['最後に参照されてから最も長い時間が経過したページを置き換える。','主記憶に読み込まれてから最も長い時間が経過したページを置き換える。','参照された回数が最も少ないページを置き換える。','最も大きいページを置き換える。'],'LRU（Least Recently Used）は最後の参照が最も古いページを追い出す。読み込み順で決めるのは FIFO、参照回数で決めるのは LFU。');
q('sw','オープンソースソフトウェアのライセンスにおけるコピーレフトの考え方はどれか。',['改変したソフトウェアを配布するとき、元と同じ条件でソースコードを公開することを求める。','ソースコードの改変を一切認めない。','著作権を放棄し、誰でも制限なく利用できるようにする。','商用利用する場合に限り、利用料の支払を求める。'],'GPL に代表されるコピーレフトは、派生物にも同じライセンス条件を引き継がせる。著作権は放棄していない。');

q('db','関係データベースの主キー制約の説明として適切なものはどれか。',['値が表の中で一意であり、かつ NULL であってはならない。','値が表の中で一意であればよく、NULL を含んでもよい。','別の表の主キーに存在する値だけを設定できる。','あらかじめ指定した範囲の値だけを設定できる。'],'主キーは行を一意に識別するため、一意性制約と非 NULL 制約の両方を満たす。3番目は参照制約（外部キー）、4番目は検査制約。');
q('db','第2正規形の表を第3正規形にするために行う操作はどれか。',['主キー以外の項目に従属している項目（推移的関数従属）を別の表に分ける。','繰返し項目を別の行に分けて排除する。','主キーの一部だけに従属している項目（部分関数従属）を別の表に分ける。','検索を速くするために、表を結合して一つにまとめる。'],'第1正規形は繰返しの排除、第2正規形は部分関数従属の排除、第3正規形は推移的関数従属の排除。');
q('db','"社員"表（社員番号, 部門, 給与）から、平均給与が 30 万以上の部門とその平均給与を求める SQL 文はどれか。',['SELECT 部門, AVG(給与) FROM 社員 GROUP BY 部門 HAVING AVG(給与) >= 300000','SELECT 部門, AVG(給与) FROM 社員 WHERE AVG(給与) >= 300000 GROUP BY 部門','SELECT 部門, AVG(給与) FROM 社員 GROUP BY 給与 HAVING 給与 >= 300000','SELECT 部門, AVG(給与) FROM 社員 WHERE 給与 >= 300000'],'グループ化した結果に対する条件は HAVING 句に書く。WHERE 句は行ごとの条件で、集合関数は使えない。');
q('db','トランザクションの ACID 特性のうち、独立性（isolation）の説明はどれか。',['複数のトランザクションを同時に実行しても、順番に実行した場合と同じ結果になる。','トランザクションの処理は、全て実行されるか、全く実行されないかのどちらかになる。','正常終了したトランザクションの結果は、障害が発生しても失われない。','トランザクションの実行前後で、データの整合性が保たれている。'],'ほかは順に原子性（atomicity）、耐久性（durability）、一貫性（consistency）。');
q('db','データベースを格納した媒体に障害が発生した。バックアップを復元したあと、更新後ログを使って障害発生直前の状態に戻す処理はどれか。',['ロールフォワード','ロールバック','チェックポイント','コミット'],'ロールフォワードは更新後ログで前進復帰する。ロールバックは更新前ログを使い、未完了のトランザクションを開始前の状態に戻す。');
q('db','関係データベースの参照制約（外部キー制約）によって防げることはどれか。',['"注文"表に、"顧客"表に存在しない顧客番号をもつ行が登録される。','同じ主キーの値をもつ行が二重に登録される。','複数の利用者が同じ行を同時に更新する。','権限のない利用者が表を参照する。'],'外部キーは参照先の表に存在する値だけを許す。二重登録は主キー制約、同時更新は排他制御、権限は GRANT で制御する。');
q('db','表に索引（インデックス）を設定したときの影響として適切なものはどれか。',['検索は速くなることが多いが、行の追加や更新では索引の保守が必要になり、遅くなることがある。','検索も更新も必ず速くなる。','検索は遅くなるが、更新は速くなる。','表の正規化が自動的に行われる。'],'索引は検索を速くする代わりに、更新のたびに索引も書き換える負荷がかかる。更新が多い列にむやみに付けない。');

q('nw','TCP と UDP を比べたとき、TCP の特徴はどれか。',['コネクションを確立し、再送や順序制御によって信頼性の高い通信を行う。','コネクションを確立せず、処理が軽いので遅延が少ない。','IP アドレスを基にパケットの経路を選択する。','MAC アドレスを基にフレームを転送する。'],'TCP はコネクション型で信頼性を保証する。UDP はコネクションレス型で、音声や動画などリアルタイム性を重視する通信に使われる。');

q('sec','公開鍵暗号方式で、A さんが B さんだけに読める暗号文を送りたい。A さんが暗号化に使う鍵はどれか。',['B さんの公開鍵','B さんの秘密鍵','A さんの公開鍵','A さんの秘密鍵'],'受信者の公開鍵で暗号化すると、対になる秘密鍵をもつ受信者だけが復号できる。送信者の秘密鍵を使うのはディジタル署名。');
q('sec','ディジタル署名を付けたメッセージを受け取った人が、署名の検証によって確認できることはどれか。',['メッセージが署名者本人によって作成され、改ざんされていないこと','メッセージが通信の途中で第三者に読まれていないこと','メッセージが確実に相手に届いたこと','メッセージにマルウェアが含まれていないこと'],'ディジタル署名で確認できるのは送信者の真正性と完全性（改ざんなし）。盗聴を防ぐ機密性は暗号化の役割。');
q('sec','暗号学的ハッシュ関数がもつ性質はどれか。',['ハッシュ値から元のメッセージを求めることが困難である。','鍵を使えば、ハッシュ値から元のメッセージを復元できる。','元のメッセージが長いほど、ハッシュ値も長くなる。','同じメッセージでも、計算するたびに異なるハッシュ値になる。'],'一方向性がある。ハッシュ値は固定長で、同じ入力からは常に同じ値が得られる。改ざん検知やパスワードの保管に使う。');
q('sec','SQL インジェクション対策として最も効果的なものはどれか。',['プレースホルダを使って SQL 文を組み立てる。','通信を TLS で暗号化する。','データベースの利用者のパスワードを長くする。','入力画面で JavaScript による入力チェックを行う。'],'プレースホルダ（バインド機構）を使うと、入力値が SQL 文の構文として解釈されなくなる。ブラウザ側のチェックは迂回できるので根本対策にならない。');
q('sec','クロスサイトスクリプティング（XSS）の説明はどれか。',['脆弱性のある Web サイトを経由して、利用者のブラウザで悪意のあるスクリプトを実行させる。','ログイン中の利用者に、意図しない処理の要求を Web サイトへ送らせる。','大量の通信を送り付けて、サーバのサービスを停止させる。','上位ディレクトリを指す文字列を使い、公開されていないファイルを読み出す。'],'XSS は出力時のエスケープ処理の不備を突く。ほかは順にクロスサイトリクエストフォージェリ（CSRF）、DoS 攻撃、ディレクトリトラバーサル。');
q('sec','情報セキュリティの三つの要素のうち、可用性が損なわれた例はどれか。',['DoS 攻撃を受けて Web サイトが利用できなくなった。','顧客情報が外部に流出した。','Web ページの内容が不正に書き換えられた。','他人のなりすましによるログインが行われた。'],'可用性は必要なときに使えること。流出は機密性、書換えは完全性が損なわれた例。');
q('sec','ランサムウェアの説明はどれか。',['ファイルを暗号化するなどして使えなくし、元に戻すことと引換えに金銭を要求する。','利用者のキー入力を記録し、外部に送信する。','有用なソフトウェアを装って侵入し、裏で不正な動作をする。','ネットワークを通じて自分自身を複製し、他のコンピュータに感染を広げる。'],'ほかは順にキーロガー、トロイの木馬、ワーム。ランサムウェア対策ではネットワークから切り離したバックアップが重要。');
q('sec','多要素認証に該当するものはどれか。',['パスワードの入力と指紋の照合','パスワードの入力と秘密の質問への回答','指紋の照合と顔の照合','2種類のパスワードの入力'],'知識・所持・生体のうち異なる種類を組み合わせるのが多要素認証。パスワードと秘密の質問はどちらも知識、指紋と顔はどちらも生体なので該当しない。');
q('sec','情報漏えいに備えてサイバー保険に加入した。このリスク対応はどれに分類されるか。',['リスク移転（共有）','リスク回避','リスク低減','リスク保有'],'保険や外部委託で損失を他者と分担するのが移転（共有）。回避は原因となる活動をやめること、低減は対策で発生確率や影響を下げること、保有は受け入れること。');
q('sec','パスワードリスト攻撃の説明はどれか。',['別のサービスから流出した ID とパスワードの組を使ってログインを試みる。','考えられる全ての文字の組合せを順に試す。','辞書に載っている単語を順に試す。','パスワードを固定し、利用者 ID を変えながら試す。'],'パスワードの使い回しを狙う攻撃。ほかは順にブルートフォース攻撃、辞書攻撃、リバースブルートフォース攻撃。');
q('sec','WAF（Web Application Firewall）の役割はどれか。',['Web アプリケーションへの通信の内容を検査し、脆弱性を突く攻撃を遮断する。','IP アドレスとポート番号だけを基に通信の許可・拒否を決める。','PC 内のファイルを検査し、マルウェアを検出する。','社内から社外への Web アクセスを代理で行い、内容をキャッシュする。'],'WAF は HTTP 通信の中身を見て SQL インジェクションなどを防ぐ。2番目はパケットフィルタリング型ファイアウォール、4番目はプロキシサーバ。');

q('bal','次の関数 sort に配列 {5, 2, 4, 1} を渡して呼び出したときの戻り値（交換した回数）はどれか。'+NOTE1,['5','3','4','6'],
'バブルソートの交換回数は、大小が逆になっている要素の組の数に等しい。(5,2) (5,4) (5,1) (2,1) (4,1) の 5 組。\n1巡目: {2,4,1,5} で3回、2巡目: {2,1,4,5} で1回、3巡目: {1,2,4,5} で1回。',
`○整数型: sort(整数型の配列: data)
  整数型: n ← dataの要素数
  整数型: cnt ← 0
  整数型: i, j, tmp
  for (i を 1 から n − 1 まで 1 ずつ増やす)
    for (j を 1 から n − i まで 1 ずつ増やす)
      if (data[j] ＞ data[j ＋ 1])
        tmp ← data[j]
        data[j] ← data[j ＋ 1]
        data[j ＋ 1] ← tmp
        cnt ← cnt ＋ 1
      endif
    endfor
  endfor
  return cnt`);
q('bal','関数 search は、昇順に整列された配列 data から target を2分探索で探し、見つかれば要素番号を、見つからなければ −1 を返す。[　a　] と [　b　] に入れる字句の組合せはどれか。'+NOTE1,['a: mid ＋ 1　　b: mid − 1','a: mid − 1　　b: mid ＋ 1','a: mid　　b: mid','a: mid ＋ 1　　b: mid ＋ 1'],
'data[mid] が target より小さいなら、目的の値は mid より後ろにあるので low ← mid ＋ 1。大きいなら前にあるので high ← mid − 1。mid 自身は調べ終わっているので範囲から外す。外さないと、範囲が狭まらず無限ループになることがある。',
`○整数型: search(整数型の配列: data, 整数型: target)
  整数型: low ← 1
  整数型: high ← dataの要素数
  整数型: mid
  while (low ≦ high)
    mid ← (low ＋ high) ÷ 2 の商
    if (data[mid] が target と等しい)
      return mid
    elseif (data[mid] ＜ target)
      low ← [　a　]
    else
      high ← [　b　]
    endif
  endwhile
  return −1`);

'2進数で表したときの 1 の個数を数える関数。45 = 32＋8＋4＋1 = 101101 なので 1 は 4 個。',
`○整数型: count(整数型: n)

`○isort(整数型の配列: data)
  整数型: n ← dataの要素数
  整数型: i, j, tmp
  for (i を 2 から n まで 1 ずつ増やす)
    tmp ← data[i]
    j ← i − 1
    while ((j ≧ 1) and (data[j] ＞ tmp))
      data[j ＋ 1] ← data[j]
      j ← j − 1
    endwhile
    data[j ＋ 1] ← tmp
  endfor`);

const KEY='fe-drill-v1';

function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.stats)S=o;}}catch(e){}}

function record(id,ok){const s=S.stats[id]||{n:0,ok:0,last:null};s.n++;if(ok)s.ok++;s.last=ok;S.stats[id]=s;save();}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function prio(x){const s=S.stats[x.id];return !s?1:(s.last===false?0:2);}
function pick(list,n){ // 間違えた問題 → 未着手 → 正解済み の順に選ぶ
  const t=[[],[],[]];shuffle(list).forEach(x=>t[prio(x)].push(x));
  return shuffle(t[0].concat(t[1],t[2]).slice(0,n));
}
function mkSession(mode,label,list,minutes){
  ses={mode,label,i:0,items:list.map(x=>({q:x,order:shuffle(x.o.map((_,k)=>k)),ans:null})),
       endAt:minutes?Date.now()+minutes*60000:null,done:false};
  view='quiz';armed=null;startTimer();render();
  if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
}
function startTimer(){stopTimer();if(ses&&ses.endAt&&typeof setInterval==='function'){timer=setInterval(tick,1000);}}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function remain(){return Math.max(0,Math.round((ses.endAt-Date.now())/1000));}
function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function tick(){if(!ses||!ses.endAt||ses.done)return stopTimer();const r=remain();const el=document.getElementById('timer');
  if(el){el.textContent=fmt(r);el.classList.toggle('low',r<=60);}if(r<=0)finishExam();}

  return {total:list.length,seen,n,ok,ng,good,rate:n?Math.round(ok/n*100):null};}

    h+=`<div class="row"><button class="btn" data-act="prev" ${ses.i===0?'disabled':''}>前へ</button><button class="btn primary" data-act="next" ${ses.i===n-1?'disabled':''}>次へ</button>
        <button class="btn" data-act="finish">${armed==='finish'?'もう一度押すと採点します':'終了して採点'}</button></div>
        <div class="grid" aria-label="問題番号">`+ses.items.map((x,k)=>`<button class="${x.ans!==null?'done':''}${k===ses.i?' cur':''}" data-act="jump" data-k="${k}" aria-label="問${k+1}${x.ans!==null?' 解答済み':''}">${k+1}</button>`).join('')+`</div>`;
  }else{
    if(answered)h+=askBox()+`<div class="row"><button class="btn primary" data-act="next">${ses.i===n-1?'結果を見る':'次の問題'}</button><button class="btn" data-act="quit">やめる</button></div>`;
    else h+=`<div class="row"><button class="btn" data-act="quit">やめる</button><span class="small muted">キーボード: <kbd>1</kbd>〜<kbd>4</kbd> で解答、<kbd>Enter</kbd> で次へ</span></div>`;
  }
  app.innerHTML=h;
}

function finishExam(){
  if(!ses||ses.done)return;ses.done=true;stopTimer();
  ses.items.forEach(it=>record(it.q.id,it.ans===0));
  view='result';armed=null;render();if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);
}
function vResult(){
  const n=ses.items.length,ok=ses.items.filter(x=>x.ans===0).length,rate=Math.round(ok/n*100),exam=ses.mode==='exam';
  let h=`<h1>${esc(ses.label)} の結果</h1><section class="card"><div class="score"><b>${rate}%</b><span class="mono">${ok} / ${n} 問正解</span>
   ${exam?`<span class="pill ${rate>=60?'ok':'ng'}">${rate>=60?'合格の目安に到達':'合格の目安（60%）に未達'}</span>`:''}</div>`;
  const by={};ses.items.forEach(it=>{const g=catOf(it.q.c).n;by[g]=by[g]||[0,0];by[g][1]++;if(it.ans===0)by[g][0]++;});
  h+=`<div class="grp">`+Object.keys(by).map(g=>`<div class="cat" style="cursor:default"><span class="nm">${esc(g)}</span><span class="ct">${by[g][0]}/${by[g][1]}</span><span class="bar" aria-hidden="true"><i class="ok" style="width:${by[g][0]/by[g][1]*100}%"></i><i class="ng" style="width:${(by[g][1]-by[g][0])/by[g][1]*100}%"></i></span></div>`).join('')+`</div>
   <div class="row"><button class="btn primary" data-act="tab" data-v="home">ホームへ</button>${ok<n?`<button class="btn" data-act="tab" data-v="review">間違えた問題を復習</button>`:''}</div></section>
   <h2>問題と解説</h2>`;
  ses.items.forEach((it,k)=>{const good=it.ans===0;
    h+=`<details class="rv" ${good?'':'open'}><summary><span class="m ${good?'ok':'ng'}">${good?'○':'×'} 問${k+1}</span><span>${esc(it.q.q.split('\n')[0].slice(0,60))}${it.q.q.length>60?'…':''}</span></summary><div class="in">${qBody(it,true)}${expBox(it)}</div></details>`;});
  app.innerHTML=h;
}

/* ========== 操作 ========== */
const A={
 tab(d){if(ses&&!ses.done&&ses.mode==='exam'&&view==='quiz')return; stopTimer();view=d.v;armed=null;render();},
 drill(d){const c=catOf(d.c);mkSession('drill',c.n,pick(Q.filter(x=>x.c===d.c),10));},
 mix(d){mkSession('drill','科目'+d.s+' おまかせ',pick(Q.filter(x=>catOf(x.c).s===d.s),d.s==='A'?10:5));},
 examA(){const g=n=>Q.filter(x=>catOf(x.c).g===n);
   mkSession('exam','科目A ミニ模試',shuffle(g('テクノロジ系')).slice(0,13).concat(shuffle(g('マネジメント系')).slice(0,3),shuffle(g('ストラテジ系')).slice(0,4)),30);},
 examB(){mkSession('exam','科目B ミニ模試',shuffle(Q.filter(x=>x.c==='bal')).slice(0,4).concat(shuffle(Q.filter(x=>x.c==='bsec')).slice(0,1)),25);},
 reviewAll(){mkSession('drill','復習',shuffle(Q.filter(x=>S.stats[x.id]&&S.stats[x.id].last===false)).slice(0,10));},
 one(d){mkSession('drill','復習',Q.filter(x=>x.id===d.id));},
 ans(d){const it=ses.items[ses.i];const oi=it.order[+d.k];if(oi===undefined)return;
   if(ses.mode==='exam'){it.ans=oi;armed=null;}else{if(it.ans!==null)return;it.ans=oi;record(it.q.id,oi===0);}
   render();},
 next(){if(ses.i<ses.items.length-1){ses.i++;armed=null;render();if(window.scrollTo)window.scrollTo(0,0);}
   else if(ses.mode!=='exam'){ses.done=true;view='result';render();if(window.scrollTo)window.scrollTo(0,0);}},
 prev(){if(ses.i>0){ses.i--;armed=null;render();}},
 jump(d){ses.i=+d.k;armed=null;render();},
 finish(){if(armed==='finish')finishExam();else{armed='finish';render();}},
 quit(){ses.done=true;view='home';render();},
 reset(){if(armed==='reset'){S={stats:{}};save();armed=null;}else armed='reset';render();},
 copy(){const it=ses.items[ses.i],x=it.q;const ta=document.getElementById('ask-text'),out=document.getElementById('ask-out'),msg=document.getElementById('copy-msg');
   const text='基本情報技術者試験の対策をしています。次の問題について教えてください。\n\n【分野】'+catOf(x.c).g+' / '+catOf(x.c).n+'\n【問題】\n'+x.q+(x.code?'\n\n'+x.code:'')+
    '\n\n【選択肢】\n'+it.order.map((oi,k)=>LBL[k]+'. '+x.o[oi]).join('\n')+'\n\n【正解】'+LBL[it.order.indexOf(0)]+'\n【私の解答】'+(it.ans===null?'未解答':LBL[it.order.indexOf(it.ans)])+
    '\n【解説】'+x.e+'\n\n【質問】\n'+((ta&&ta.value.trim())||'この問題の考え方を、初学者にも分かるように説明してください。');
   const fail=()=>{out.hidden=false;out.value=text;out.focus();out.select();msg.textContent='自動コピーできませんでした。下の文章を選択してコピーしてください。';};
   try{navigator.clipboard.writeText(text).then(()=>{msg.textContent='コピーしました。Claude に貼り付けてください。';},fail);}catch(e){fail();}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=A[t.dataset.act];if(f)f(t.dataset);});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||!ses||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='textarea'||tag==='input')return;
  if(/^[1-6]$/.test(e.key)){A.ans({k:+e.key-1});}
  else if(e.key==='Enter'&&tag!=='button'&&tag!=='summary'&&tag!=='a'){const it=ses.items[ses.i];if(ses.mode==='exam'||it.ans!==null)A.next();}
});
load();render();
</script>
