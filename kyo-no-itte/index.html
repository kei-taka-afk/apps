<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: phone-first app shell — one view at a time, fixed bottom tab bar, edit sheets slide up from the bottom */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#1d2a2b; --muted:#5d6b6b; --line:#d8dfdd;
  --accent:#2f6b5e; --accent-ink:#ffffff; --accent-soft:#e1eeea;
  --sell:#a24a3a; --sell-soft:#f6e4e0; --warn:#8f620e; --warn-soft:#f6ecd6; --shade:rgba(20,30,30,.35);
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131919; --surface:#1c2423; --ink:#e4ebe9; --muted:#9aa8a6; --line:#2e3a39;
  --accent:#7cc0ac; --accent-ink:#10201c; --accent-soft:#1f3631;
  --sell:#e39282; --sell-soft:#3b2420; --warn:#e2b45e; --warn-soft:#3a2f18; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131919; --surface:#1c2423; --ink:#e4ebe9; --muted:#9aa8a6; --line:#2e3a39;
  --accent:#7cc0ac; --accent-ink:#10201c; --accent-soft:#1f3631;
  --sell:#e39282; --sell-soft:#3b2420; --warn:#e2b45e; --warn-soft:#3a2f18; --shade:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;margin:0;letter-spacing:.05em}
.date{color:var(--muted);font-size:.85rem}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0}
.muted{color:var(--muted);font-size:.85rem}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.block{width:100%}
.btn.small{min-height:34px;padding:0 12px;font-size:.85rem}
.btn.danger{color:var(--sell)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.notice{background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:.9rem;display:grid;gap:10px}

/* summary */
.summary{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.summary .big{font-family:var(--f-num);font-size:1.6rem;line-height:1.2}
.chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--sell-soft);color:var(--sell)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;grid-column:1/-1;background:var(--bg)}
.stack i{display:block;height:100%}

/* orders */
.progress{display:flex;justify-content:space-between;align-items:baseline}
.orders{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.order{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.order>div{min-width:0;display:grid;gap:4px}
.tick{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1.2rem;color:transparent}
.order.done{opacity:.55}
.order.done .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.order.done .what{text-decoration:line-through}
.kind{font-size:.75rem;font-weight:700;letter-spacing:.08em}
.k-buy{color:var(--accent)} .k-sell{color:var(--sell)} .k-check{color:var(--warn)}
.what{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.amt{font-family:var(--f-num)}
.why{color:var(--muted);font-size:.85rem}
.order .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.rest{background:var(--accent-soft);border-radius:14px;padding:18px;display:grid;gap:6px}
.rest strong{font-family:var(--f-display);font-size:1.35rem}

/* holdings */
.hlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.hcard .name{font-weight:700;overflow-wrap:anywhere;min-width:0}
.hcard .val{font-family:var(--f-num);text-align:right}
.hcard .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.dots{display:inline-flex;gap:3px}
.dots b{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dots b.on{background:var(--accent)}
.group-h{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:6px}
.quick{display:grid;gap:8px}
.qrow{display:grid;grid-template-columns:1fr 46%;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.qrow label{font-weight:500;overflow-wrap:anywhere;min-width:0;font-size:.92rem}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:44px}
input.yen{text-align:right;font-family:var(--f-num)}

/* rules */
.field{display:grid;gap:6px}
.field>span{font-size:.9rem;font-weight:500}
.field small{color:var(--muted);font-size:.8rem}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper input{text-align:center;font-family:var(--f-num)}
.stepper button{border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:1.2rem}
.sum{display:flex;justify-content:space-between;font-size:.9rem}

/* log */
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.log li span:last-child{min-width:0;overflow-wrap:anywhere}
.log .num{color:var(--muted);font-size:.8rem}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{min-height:58px;display:grid;place-items:center;align-content:center;gap:2px;font-size:.78rem;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--sell);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* sheet */
.shade{position:fixed;inset:0;background:var(--shade);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:560px;margin:0 auto;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg.four{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.9rem;padding:4px 8px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.hr{display:grid;gap:8px}
.hr label{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;cursor:pointer}
.hr input{width:22px;height:22px;min-height:0;margin:2px 0 0;accent-color:var(--accent)}
.hr small{display:block;color:var(--muted);font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;z-index:40;display:flex;gap:14px;align-items:center;font-size:.9rem;max-width:calc(100% - 32px)}
.toast button{color:var(--bg);font-weight:700;text-decoration:underline}
footer{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <h1>今日の一手</h1>
    <span class="date" id="today"></span>
  </header>
  <main id="view"></main>
  <footer>注文はSBI証券のアプリで自分で出します。このページは自分で決めたルールを計算するだけで、投資助言ではありません。<span id="saveState"></span></footer>
</div>

<nav class="tabs" aria-label="画面の切り替え"><div class="in" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>今日<span class="badge" id="badge" hidden></span></button>
  <button role="tab" data-tab="hold" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/></svg>保有</button>
  <button role="tab" data-tab="rules" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>ルール</button>
  <button role="tab" data-tab="log" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>記録</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
const BUCKETS=[
  {id:"world",name:"世界株・ESG投信",short:"世界株",color:"var(--accent)"},
  {id:"japan",name:"日本株投信",short:"日本株",color:"#6f8fb0"},
  {id:"cheer",name:"応援株（個別株）",short:"応援株",color:"#c08a3e"},
  {id:"safe",name:"債券・現金",short:"債券・現金",color:"#9aa6a4"}
];
const ACCTS={nisa:"NISA",tokutei:"特定・一般"};
const HR=[
  ["人権方針を公表している","会社のサイトに「人権方針」がある"],
  ["取引先も含めて人権リスクを調べ、対策している","報告書に「人権デューデリジェンス」の記載がある"],
  ["働く人の待遇・労災・離職などを開示している","統合報告書などに人的資本のデータがある"]
];
const SAMPLE={isSample:true,
  settings:{day:27,amount:50000,band:5,cap:5,targets:{world:50,japan:20,cheer:15,safe:15}},
  holdings:[
    {id:"h1",name:"例）ESG世界株インデックス",bucket:"world",acct:"nisa",value:1350000,c:[true,true,true]},
    {id:"h2",name:"例）日本株インデックス",bucket:"japan",acct:"nisa",value:420000,c:[false,false,false]},
    {id:"h3",name:"例）応援株A",bucket:"cheer",acct:"tokutei",value:160000,c:[true,true,true]},
    {id:"h4",name:"例）応援株B",bucket:"cheer",acct:"nisa",value:190000,c:[true,false,true]},
    {id:"h5",name:"例）米国個別株C",bucket:"cheer",acct:"tokutei",value:95000,c:[false,false,false]},
    {id:"h6",name:"現金（SBI預り金）",bucket:"safe",acct:"tokutei",value:300000,c:[true,true,true]}
  ],updatedAt:null,log:[]};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(SAMPLE);
let tab="today", quickMode=false;
try{tab=localStorage.getItem("kni-tab")||"today"}catch(e){}

const yen=n=>"¥"+Math.round(n||0).toLocaleString("ja-JP");
const r1000=n=>Math.round(n/1000)*1000;
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const monthKey=todayKey.slice(0,7);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parseYen=s=>Math.max(0,parseInt(String(s).replace(/[^\d]/g,""),10)||0);
$("today").textContent=`${now.getMonth()+1}月${now.getDate()}日（${"日月火水木金土"[now.getDay()]}）`;

function normalize(d){
  d.settings=Object.assign(clone(SAMPLE.settings),d.settings||{});
  d.settings.targets=Object.assign(clone(SAMPLE.settings.targets),d.settings.targets||{});
  d.holdings=(d.holdings||[]).map(h=>({acct:"tokutei",c:[false,false,false],...h}));
  d.log=d.log||[];return d;
}

/* ---------- storage: private db doc, browser fallback ---------- */
let docRef=null,saveTimer=null,saving=false,dirty=false;
const LS="kyou-no-itte-v1";
function lsGet(){try{const v=localStorage.getItem(LS);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function setSave(t){$("saveState").textContent=t?" "+t:""}
function save(){dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(saving||!dirty)return;dirty=false;lsSet();
  if(!docRef){setSave("（このブラウザに保存）");return}
  saving=true;
  try{await docRef.set(clone(S));setSave("（保存済み）")}
  catch(e){setSave("（クラウドに保存できませんでした。このブラウザには残っています）")}
  saving=false;if(dirty)flush();
}
(async()=>{
  const local=lsGet();if(local){S=normalize(local);render()}
  try{
    if(!window.claude)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    docRef=db.collection("data/users/"+uid).doc("portfolio");
    const snap=await Promise.race([docRef.get(),new Promise((_,r)=>setTimeout(()=>r(0),10000))]);
    if(snap.exists){S=normalize(snap.data());lsSet();render()}
    else if(local&&!local.isSample){dirty=true;flush()}
  }catch(e){}
})();

/* ---------- rules engine ---------- */
const ok=h=>h.c.every(Boolean);
function analyse(){
  const st=S.settings,H=S.holdings;
  const total=H.reduce((a,h)=>a+(+h.value||0),0);
  const cur={};BUCKETS.forEach(b=>cur[b.id]=0);
  H.forEach(h=>cur[h.bucket]=(cur[h.bucket]||0)+(+h.value||0));
  const pct={};BUCKETS.forEach(b=>pct[b.id]=total?cur[b.id]/total*100:0);
  const offBuckets=BUCKETS.filter(b=>total&&Math.abs(pct[b.id]-st.targets[b.id])>st.band);
  const O=[];
  // pick what to buy: passes human-rights check first, NISA first, then largest
  const toBuy=b=>H.filter(h=>h.bucket===b).sort((x,y)=>(ok(y)-ok(x))||((y.acct==="nisa")-(x.acct==="nisa"))||(y.value-x.value))[0];
  // pick what to sell: fails human-rights check first, taxable account first, then largest
  const toSell=b=>H.filter(h=>h.bucket===b&&h.value>0).sort((x,y)=>(ok(x)-ok(y))||((x.acct==="nisa")-(y.acct==="nisa"))||(y.value-x.value))[0];

  const age=S.updatedAt?Math.floor((now-new Date(S.updatedAt))/864e5):null;
  if(age===null||age>=7)O.push({key:"update",type:"check",what:"SBIで評価額を見て、保有を更新する",why:age===null?"まだ一度も更新していません。数字が古いと、指示も古くなります。":`前回の更新から${age}日たっています。`,act:"quick"});

  const paid=S.log.some(l=>String(l.key).startsWith("tsumitate-"+monthKey));
  if(now.getDate()>=st.day&&!paid&&st.amount>0&&total>0){
    const after=total+st.amount,need={};let sum=0;
    BUCKETS.forEach(b=>{need[b.id]=Math.max(0,st.targets[b.id]/100*after-cur[b.id]);sum+=need[b.id]});
    BUCKETS.forEach(b=>{const amt=sum?r1000(st.amount*need[b.id]/sum):0;if(amt<1000)return;const h=toBuy(b.id);
      O.push({key:`tsumitate-${monthKey}-${b.id}`,type:"buy",name:h?h.name:b.name,amt,what:`${h?h.name:b.name}`,why:`今月の積立 ${yen(st.amount)} のうち、目標より少ない「${b.short}」に回す分。SBIで積立設定をしているなら、設定額がこれと合っているかだけ確認します。`})});
  }

  if(offBuckets.length){
    BUCKETS.forEach(b=>{
      const diff=cur[b.id]-st.targets[b.id]/100*total;const gap=Math.abs(pct[b.id]-st.targets[b.id]);
      if(Math.abs(diff)<1000||(!offBuckets.includes(b)&&gap<st.band/2))return;
      const amt=r1000(Math.abs(diff));
      if(diff>0){const h=toSell(b.id);O.push({key:"reb-"+b.id,type:"sell",name:h?h.name:b.name,amt,what:h?h.name:b.name,why:`「${b.short}」が ${pct[b.id].toFixed(1)}%（目標 ${st.targets[b.id]}%）。増えすぎた分を戻します。${h&&h.acct==="nisa"?"NISA口座の分は売ると非課税枠が今年は戻らないので、気になるなら売らずに翌月以降の積立で調整してもかまいません。":""}`})}
      else{const h=toBuy(b.id);O.push({key:"reb-"+b.id,type:"buy",name:h?h.name:b.name,amt,what:h?h.name:b.name,why:`「${b.short}」が ${pct[b.id].toFixed(1)}%（目標 ${st.targets[b.id]}%）。値下がりなどで減った分を、ルールどおり買い足します。`})}
    });
  }

  H.filter(h=>h.bucket==="cheer").forEach(h=>{
    const p=total?h.value/total*100:0;
    if(p>st.cap){const amt=r1000(h.value-st.cap/100*total);if(amt>=1000)O.push({key:"cap-"+h.id,type:"sell",name:h.name,amt,what:h.name,why:`1社で全体の ${p.toFixed(1)}%。上限 ${st.cap}% を超えた分を減らして、1社の値動きに資産を預けすぎないようにします。`})}
    if(!ok(h)){const miss=h.c.map((v,i)=>v?null:"①②③"[i]).filter(Boolean).join("");
      O.push({key:"hr-"+h.id,type:"check",what:`${h.name}の人権の取り組みを調べる`,why:`チェック${miss}が未確認です。会社のサイトの「サステナビリティ」や統合報告書で確認し、満たさないと判断したら売る候補にします。`,act:"edit",hid:h.id})}
  });
  const doneKeys=new Set(S.log.filter(l=>l.date===todayKey).map(l=>l.key));
  O.forEach(o=>o.done=doneKeys.has(o.key));
  return {total,cur,pct,offBuckets,orders:O};
}

/* ---------- views ---------- */
const KIND={buy:["買う","k-buy"],sell:["売る","k-sell"],check:["確認","k-check"]};
function summaryHTML(A){
  const st=S.settings;const off=A.offBuckets.length;
  return `<section class="panel summary" aria-label="資産の概要">
    <span class="muted">合計（${S.updatedAt?new Date(S.updatedAt).toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"})+"時点":"未更新"}）</span>
    <span class="chip ${off?"bad":"ok"}">${off?"配分がずれています":"配分は目標の範囲内"}</span>
    <span class="big">${yen(A.total)}</span><span></span>
    <div class="stack" aria-hidden="true">${BUCKETS.map(b=>`<i style="width:${A.pct[b.id]}%;background:${b.color}"></i>`).join("")}</div>
  </section>`;
}
function viewToday(){
  const A=analyse();const left=A.orders.filter(o=>!o.done),done=A.orders.filter(o=>o.done);
  let h=sampleNotice()+summaryHTML(A);
  if(!A.orders.length){
    h+=`<section class="rest"><strong>今日は何もしない</strong><p>配分は目標の範囲内で、積立もまだ先か今月分は済んでいます。値動きが大きい日でも、ルールが動いていなければ何もしないのが正解です。</p></section>`;
  }else{
    h+=`<section style="display:grid;gap:10px"><div class="progress"><h2>今日やること</h2><span class="muted num">${done.length} / ${A.orders.length} 完了</span></div><ul class="orders">${[...left,...done].map(orderHTML).join("")}</ul>`;
    if(!left.length)h+=`<div class="rest"><strong>今日の分は完了</strong><p>おつかれさまでした。次の指示は、数字が変わったときかルールの日に出ます。</p></div>`;
    h+=`</section>`;
  }
  return h;
}
function orderHTML(o){
  const [k,cls]=KIND[o.type];
  const what=o.amt?`${esc(o.what)}<br><span class="amt">${yen(o.amt)}</span> ${o.type==="buy"?"買う":"売る"}`:esc(o.what);
  let acts="";
  if(!o.done){
    if(o.name)acts+=`<button class="btn small" data-copy="${esc(o.name)}">銘柄名をコピー</button>`;
    if(o.act==="quick")acts+=`<button class="btn small" data-go="quick">いま更新する</button>`;
    if(o.act==="edit")acts+=`<button class="btn small" data-edit="${o.hid}">チェックを付ける</button>`;
  }
  return `<li class="order${o.done?" done":""}"><button class="tick" data-done="${o.key}" data-text="${esc(o.amt?`${o.what} ${yen(o.amt)} ${o.type==="buy"?"買う":"売る"}`:o.what)}" aria-pressed="${o.done}" aria-label="${o.done?"未完了に戻す":"やった"}">✓</button>
    <div><span class="kind ${cls}">${k}</span><div class="what">${what}</div>${o.done?"":`<p class="why">${esc(o.why)}</p>`}${acts?`<div class="acts">${acts}</div>`:""}</div></li>`;
}
function sampleNotice(){
  return S.isSample?`<div class="notice"><p>いまは<strong>例の保有</strong>を表示しています。自分の保有に入れ替えると、自分用の指示に変わります。</p><button class="btn primary" data-act="start">自分の保有を入れる</button></div>`:"";
}
function viewHold(){
  const A=analyse();
  if(quickMode){
    return `<section style="display:grid;gap:12px"><h2>評価額をまとめて更新</h2><p class="muted">SBIアプリの「口座管理 → 保有証券」を見ながら、評価額を上から入れていきます。</p>
      <div class="quick">${S.holdings.map(h=>`<div class="qrow"><label for="q-${h.id}">${esc(h.name||"（名前なし）")}<br><span class="muted">${ACCTS[h.acct]}</span></label><input id="q-${h.id}" class="yen" inputmode="numeric" value="${h.value?Number(h.value).toLocaleString("ja-JP"):""}" data-q="${h.id}" placeholder="0"></div>`).join("")}</div>
      <button class="btn primary block" data-act="quickDone">更新を完了</button><button class="btn block" data-act="quickCancel">やめる</button></section>`;
  }
  let h=sampleNotice()+`<div class="row"><button class="btn primary" data-go="quick">評価額をまとめて更新</button><button class="btn" data-act="add">＋ 銘柄を追加</button></div>`;
  BUCKETS.forEach(b=>{
    const list=S.holdings.filter(x=>x.bucket===b.id);
    h+=`<div class="group-h"><span>${b.name}</span><span class="num">${A.pct[b.id].toFixed(1)}% / 目標 ${S.settings.targets[b.id]}%</span></div>`;
    h+=list.length?`<ul class="hlist">${list.map(x=>`<li><button class="hcard" data-edit="${x.id}"><span class="name">${esc(x.name||"（名前なし）")}</span><span class="val">${yen(x.value)}</span><span class="meta">${ACCTS[x.acct]}<span>・人権</span><span class="dots">${x.c.map(v=>`<b class="${v?"on":""}"></b>`).join("")}</span>${ok(x)?"":`<span class="chip warn">未確認あり</span>`}</span></button></li>`).join("")}</ul>`:`<p class="muted">まだありません。</p>`;
  });
  return h;
}
function stepper(id,label,val,step,min,max,help){
  return `<div class="field"><span id="l-${id}">${label}</span><div class="stepper"><button data-step="${id}" data-d="-${step}" aria-label="減らす">−</button><input id="${id}" inputmode="numeric" value="${val}" data-min="${min}" data-max="${max}" aria-labelledby="l-${id}"><button data-step="${id}" data-d="${step}" aria-label="増やす">＋</button></div>${help?`<small>${help}</small>`:""}</div>`;
}
function viewRules(){
  const st=S.settings;const sum=BUCKETS.reduce((a,b)=>a+(+st.targets[b.id]||0),0);
  return `<p class="muted">数字はすべて自分で決めます。最初から入っている数字は例です。</p>
  <section class="panel"><h2>毎月の積立</h2>
    ${stepper("r-day","積立日（毎月）",st.day,1,1,28,"この日以降、今月の積立が終わるまで「買う」が出ます。")}
    ${stepper("r-amt","積立額（円）",st.amount,5000,0,10000000,"")}
  </section>
  <section class="panel"><h2>目標の配分</h2>
    ${BUCKETS.map(b=>stepper("t-"+b.id,b.name+"（%）",st.targets[b.id],5,0,100,"")).join("")}
    <div class="sum"><span>合計</span><span class="num chip ${sum===100?"ok":"bad"}">${sum}%${sum===100?"":"（100%にしてください）"}</span></div>
  </section>
  <section class="panel"><h2>売り買いの決まり</h2>
    ${stepper("r-band","リバランスする「ずれ」（%ポイント）",st.band,1,1,20,"目標からこれ以上ずれたら、売り買いで戻します。小さいほど売買が増えます。")}
    ${stepper("r-cap","応援株1社の上限（全体の%）",st.cap,1,1,50,"超えた分は売って減らします。")}
  </section>`;
}
function viewLog(){
  return `<h2>実行記録</h2><ul class="log">${S.log.length?S.log.slice().reverse().slice(0,60).map(l=>`<li><span class="num">${l.date.slice(5).replace("-","/")}</span><span>${esc(l.text)}</span></li>`).join(""):`<li><span></span><span class="muted">「今日」の画面で ✓ を押すと、ここに残ります。</span></li>`}</ul>`;
}
function render(){
  const A=analyse();const n=A.orders.filter(o=>!o.done).length;
  $("badge").hidden=!n;$("badge").textContent=n;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  $("view").innerHTML=`<div style="display:grid;gap:16px">${{today:viewToday,hold:viewHold,rules:viewRules,log:viewLog}[tab]()}</div>`;
}
function go(t){tab=t;quickMode=false;try{localStorage.setItem("kni-tab",t)}catch(e){}render();scrollTo(0,0)}

/* ---------- sheet (edit holding) ---------- */
let editing=null;
function openEdit(id){
  const h=S.holdings.find(x=>x.id===id);if(!h)return;editing=clone(h);drawSheet();
}
function drawSheet(){
  const h=editing;
  $("sheetRoot").innerHTML=`<div class="shade" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="in">
    <h2 id="sh-t">${S.holdings.some(x=>x.id===h.id)?"銘柄を編集":"銘柄を追加"}</h2>
    <label class="field"><span>銘柄名</span><input id="e-name" value="${esc(h.name)}" placeholder="例）eMAXIS Slim 全世界株式"></label>
    <label class="field"><span>評価額（円）</span><input id="e-val" class="yen" inputmode="numeric" value="${h.value?Number(h.value).toLocaleString("ja-JP"):""}" placeholder="0"></label>
    <div class="field"><span>区分</span><div class="seg four">${BUCKETS.map(b=>`<button data-seg="bucket" data-v="${b.id}" aria-pressed="${h.bucket===b.id}">${b.name}</button>`).join("")}</div></div>
    <div class="field"><span>口座</span><div class="seg">${Object.entries(ACCTS).map(([k,v])=>`<button data-seg="acct" data-v="${k}" aria-pressed="${h.acct===k}">${v}</button>`).join("")}</div></div>
    <div class="field"><span>人権チェック</span><small>自分で調べて、当てはまるものに付けます。人権・ESGの基準で銘柄を選んでいる投信なら3つとも付けます。</small>
      <div class="hr">${HR.map((r,i)=>`<label for="e-c${i}"><input type="checkbox" id="e-c${i}" ${h.c[i]?"checked":""}><span>${"①②③"[i]} ${r[0]}<small>目安：${r[1]}</small></span></label>`).join("")}</div></div>
    <button class="btn primary block" data-act="saveEdit">保存</button>
    <div class="row"><button class="btn" data-act="close">やめる</button>${S.holdings.some(x=>x.id===h.id)?`<button class="btn danger" data-act="del">この銘柄を削除</button>`:""}</div>
  </div></div>`;
}
function readSheet(){
  editing.name=$("e-name").value.trim();editing.value=parseYen($("e-val").value);
  editing.c=[0,1,2].map(i=>$("e-c"+i).checked);
}
function closeSheet(){editing=null;$("sheetRoot").innerHTML=""}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,undo){
  $("toastRoot").innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?`<button data-act="undo">元に戻す</button>`:""}</div>`;
  lastUndo=undo;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$("toastRoot").innerHTML="";lastUndo=null},4000);
}
let lastUndo=null;

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-act]");if(!t)return;
  const d=t.dataset;
  if(d.tab)return go(d.tab);
  if(d.go==="quick"){tab="hold";quickMode=true;render();scrollTo(0,0);return}
  if(d.done){
    const i=S.log.findIndex(l=>l.date===todayKey&&l.key===d.done);
    if(i>=0){S.log.splice(i,1)}else{S.log.push({date:todayKey,key:d.done,text:d.text});if(d.done==="update")S.updatedAt=new Date().toISOString();toast("記録しました",()=>{const j=S.log.findIndex(l=>l.date===todayKey&&l.key===d.done);if(j>=0)S.log.splice(j,1)})}
    save();render();return;
  }
  if(d.copy){
    try{await navigator.clipboard.writeText(d.copy);toast("コピーしました。SBIアプリの検索に貼り付けます")}
    catch(err){toast("コピーできませんでした："+d.copy)}
    return;
  }
  if(d.edit){openEdit(d.edit);return}
  if(d.seg){editing[d.seg]=d.v;readSheet();drawSheet();return}
  if(d.step){const el=$(d.step);const v=Math.min(+el.dataset.max,Math.max(+el.dataset.min,parseYen(el.value)+ +d.d));el.value=v;applyRule(el);return}
  switch(d.act){
    case "start":
      S={isSample:false,settings:clone(S.settings),holdings:[],updatedAt:null,log:[]};
      save();tab="hold";render();editing={id:"h"+Date.now(),name:"",bucket:"world",acct:"nisa",value:0,c:[false,false,false]};drawSheet();$("e-name").focus();break;
    case "add":
      editing={id:"h"+Date.now(),name:"",bucket:"cheer",acct:"tokutei",value:0,c:[false,false,false]};drawSheet();$("e-name").focus();break;
    case "saveEdit":{
      readSheet();if(!editing.name){$("e-name").focus();$("e-name").placeholder="銘柄名を入れてください";return}
      const i=S.holdings.findIndex(x=>x.id===editing.id);
      if(i>=0)S.holdings[i]=editing;else S.holdings.push(editing);
      closeSheet();save();render();toast("保存しました");break;}
    case "del":{
      const prev=clone(S.holdings);S.holdings=S.holdings.filter(x=>x.id!==editing.id);closeSheet();save();render();
      toast("削除しました",()=>{S.holdings=prev});break;}
    case "close":closeSheet();break;
    case "quickDone":
      document.querySelectorAll("[data-q]").forEach(inp=>{const h=S.holdings.find(x=>x.id===inp.dataset.q);if(h)h.value=parseYen(inp.value)});
      S.updatedAt=new Date().toISOString();
      if(!S.log.some(l=>l.date===todayKey&&l.key==="update"))S.log.push({date:todayKey,key:"update",text:"評価額を更新した"});
      quickMode=false;tab="today";save();render();scrollTo(0,0);toast("更新しました。今日の指示を計算し直しました");break;
    case "quickCancel":quickMode=false;render();break;
    case "undo":if(lastUndo){lastUndo();lastUndo=null;$("toastRoot").innerHTML="";save();render()}break;
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing)closeSheet()});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.classList.contains("yen")){const pos=el.value.length;const n=parseYen(el.value);el.value=n?n.toLocaleString("ja-JP"):"";}
});
document.addEventListener("change",e=>{const el=e.target;if(el.closest(".stepper"))applyRule(el)});
function applyRule(el){
  const v=Math.min(+el.dataset.max,Math.max(+el.dataset.min,parseYen(el.value)));el.value=v;
  const st=S.settings,id=el.id;
  if(id.startsWith("t-"))st.targets[id.slice(2)]=v;
  else st[{"r-day":"day","r-amt":"amount","r-band":"band","r-cap":"cap"}[id]]=v;
  save();
  const sum=BUCKETS.reduce((a,b)=>a+(+st.targets[b.id]||0),0);
  const chip=document.querySelector(".sum .chip");
  if(chip){chip.textContent=sum+"%"+(sum===100?"":"（100%にしてください）");chip.className="num chip "+(sum===100?"ok":"bad")}
  const A=analyse(),n=A.orders.filter(o=>!o.done).length;$("badge").hidden=!n;$("badge").textContent=n;
}
render();
</script>

</body></html>
