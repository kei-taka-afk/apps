<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
/* layout: one narrow working column; domain = colored left stripe; code terms in mono */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#16202a; --muted:#5b6875; --line:#d4dbe2;
  --accent:#0b6b7a; --accent-ink:#ffffff; --good:#1c7c4a; --bad:#b3372f; --tint:#e6eef1;
  --d1:#3b5bdb; --d2:#0b7285; --d3:#c2410c; --d4:#7048e8; --d5:#2b8a3e;
  --display:"Zen Kaku Gothic New","Noto Sans JP","Hiragino Sans",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --surface:#18212a; --ink:#e6ecf1; --muted:#93a1ae; --line:#2b3743;
    --accent:#4fb8c9; --accent-ink:#06222a; --good:#5cc48a; --bad:#ef7f76; --tint:#1f2c36;
    --d1:#8da2fb; --d2:#5cc3d6; --d3:#f59f6b; --d4:#b197fc; --d5:#69c37b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e6ecf1; --muted:#93a1ae; --line:#2b3743;
  --accent:#4fb8c9; --accent-ink:#06222a; --good:#5cc48a; --bad:#ef7f76; --tint:#1f2c36;
  --d1:#8da2fb; --d2:#5cc3d6; --d3:#f59f6b; --d4:#b197fc; --d5:#69c37b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-top:8px}
h1{font-family:var(--display);font-weight:900;font-size:1.5rem;margin:0;letter-spacing:.01em}
h1 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);margin-left:8px}
h2{font-family:var(--display);font-size:1.1rem;margin:0;text-wrap:balance}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:500}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:0}
.facts div{border-left:3px solid var(--line);padding-left:10px}
.facts dt{font-size:.75rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted);margin:0}
.dom{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:12px 14px;
  font:inherit;color:inherit;cursor:pointer}
.dom:hover{background:var(--tint)}
.dom b{font-weight:700}
.dom span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:700;font-size:.92rem;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c);font-weight:700;font-size:.78rem}
.q{font-size:1.02rem;font-weight:500;margin:0}
code{font-family:var(--mono);font-size:.86em;background:var(--tint);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
.opt:disabled{cursor:default}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--muted);flex:none}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.ok .k{color:var(--good)}
.opt.ng{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt.ng .k{color:var(--bad)}
.exp{border-left:4px solid var(--good);background:var(--tint);border-radius:0 8px 8px 0;padding:12px 14px;font-size:.93rem}
.exp.miss{border-left-color:var(--bad)}
.exp b{display:block;margin-bottom:2px}
.score{font-family:var(--display);font-size:2.4rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.notes ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.notes .card{border-left:5px solid var(--c)}
textarea{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

  </nav>
</header>
<main id="app" class="list" style="gap:20px"></main>
</div>

 3:{n:'Claude Codeの設定とワークフロー',w:20},

// [分野, タスク, 問題, [正解, 誤答, 誤答, 誤答], 解説]  選択肢は表示時にシャッフル
var Q=[
[1,'1.1','エージェントループで、次の反復に進むか終了するかを判断する最も信頼できる方法はどれか。',['`stop_reason` を確認し、`tool_use` ならツールを実行して続行、`end_turn` なら終了する','アシスタントの返答文に「完了しました」などの語句が含まれるかを解析する','反復回数の上限（例: 10回）を主な停止条件にする','テキストブロックが返ってきた時点で完了とみなす'],'ループ制御は `stop_reason` で行う。自然言語の解析、任意の反復上限を主条件にすること、テキストの有無を完了シグナルとすることは典型的なアンチパターン。'],
[1,'1.1','ツールを実行した後、その結果はどう扱うべきか。',['会話履歴に追加し、次のリクエストで履歴ごとモデルに送る','system prompt の末尾に追記していく','最新のツール結果だけを送り、それ以前の履歴は破棄する','結果ごとに新しいセッションを開始する'],'ツール結果を履歴に追加して送り返すことで、モデルは新しい情報をもとに次の行動を推論できる。'],
[1,'1.2','coordinator が生成したサブエージェントは、coordinator の会話履歴をどう扱うか。',['継承しない。必要な情報は prompt に明示的に含めて渡す必要がある','自動的にすべて継承する','直近10ターン分だけ自動で継承する','同じ system prompt を使っていれば共有される'],'サブエージェントは分離されたコンテキストで動く。親の履歴は自動では渡らないので、必要な所見は prompt に書き込む。'],
[1,'1.2','マルチエージェント調査システムに「AIがクリエイティブ産業に与える影響」を調べさせたところ、レポートは視覚芸術しか扱っていなかった。各サブエージェントは割り当てられた作業を正しく完了している。原因として最も可能性が高いのはどれか。',['coordinator のタスク分解が狭すぎて、音楽・執筆・映像などが割り当てられなかった','synthesis エージェントが他分野の所見を捨てた','web search エージェントのクエリが不十分だった','document analysis エージェントのフィルタが厳しすぎた'],'サブエージェントが割り当てどおりに動いているなら、問題は割り当てそのもの、つまり coordinator の分解にある。'],
[1,'1.2','マルチエージェント構成で、サブエージェント同士を直接通信させず coordinator 経由にする主な理由はどれか。',['可観測性・一貫したエラー処理・情報の流れの制御を coordinator に集約できるから','直接通信は API 上禁止されているから','coordinator 経由のほうが必ずトークン消費が少ないから','サブエージェントは同時に1つしか起動できないから'],'hub-and-spoke 構成では、サブエージェント間の通信・エラー処理・ルーティングをすべて coordinator が担う。'],
[1,'1.3','Agent SDK で coordinator がサブエージェントを起動できない。まず確認すべき設定はどれか。',['coordinator の `allowedTools` に `"Task"` が含まれているか','サブエージェントの `max_tokens` が十分か','`.mcp.json` にサブエージェントが登録されているか','`tool_choice` が `"auto"` になっているか'],'サブエージェントは Task ツールで起動する。coordinator の `allowedTools` に `"Task"` がなければ起動できない。'],
[1,'1.3','3つのサブエージェントを並列に走らせたい。正しい方法はどれか。',['coordinator の1回の応答で複数の Task 呼び出しを出す','ターンを分けて1つずつ Task を呼ぶ','`fork_session` を3回実行する','Message Batches API に3件まとめて送る'],'1つの応答に複数の Task ツール呼び出しを含めると並列実行される。ターンを分けると逐次実行になる。'],
[1,'1.3','synthesis サブエージェントの出力から出典情報が失われる。上流から所見を渡すときの改善策はどれか。',['内容とメタデータ（URL・文書名・ページ番号）を分けた構造化形式で渡す','所見を1段落の要約にまとめて渡す','出典は coordinator だけが保持し、サブエージェントには渡さない','synthesis エージェントに web 検索ツールを与えて再検索させる'],'内容と出典メタデータを分離した構造化形式にすると、後段でも帰属が保たれる。'],
[1,'1.3','coordinator がサブエージェントに渡す prompt の書き方として適切なのはどれか。',['達成すべきゴールと品質基準を示す','実行手順を1ステップずつ細かく指定する','「前の会話を参照して」とだけ書く','ツール名の一覧だけを渡す'],'手順の逐一指定よりも、ゴールと品質基準を示すほうがサブエージェントは状況に適応できる。履歴は継承されないので「前の会話」は参照できない。'],
[1,'1.4','サポートエージェントが、12%のケースで `get_customer` による本人確認を飛ばして `process_refund` を呼んでいる。最も効果的な対策はどれか。',['`get_customer` が検証済みIDを返すまで `process_refund` をプログラム的にブロックする前提条件ゲートを設ける','system prompt で「必ず本人確認をすること」と強調する','本人確認してから返金する few-shot 例を追加する','リクエストを分類して使えるツールを絞るルーティング層を追加する'],'順序の遵守が必須（金銭が絡む）なら、プロンプトによる誘導では失敗率がゼロにならない。プログラム的な強制が必要。'],
[1,'1.4','エージェントが人間の担当者に引き継ぐとき、何を渡すべきか。',['顧客ID・根本原因・返金額・推奨アクションをまとめた構造化サマリー','会話全文へのリンクだけ','「エスカレーションが必要」という一文','直近のツール呼び出し結果の生データ'],'人間の担当者は会話記録を見られない前提で、必要事項を自己完結した構造化サマリーとして渡す。'],
[1,'1.5','複数のMCPツールが Unix タイムスタンプ、ISO 8601、数値ステータスコードなど異なる形式で結果を返し、モデルが混乱している。適切な対処はどれか。',['PostToolUse hook で、モデルが見る前にツール結果を正規化する','system prompt に各形式の読み方を列挙する','モデルに毎回形式を推測させる','ツールごとに別のサブエージェントを割り当てる'],'PostToolUse hook はツール結果をモデルに渡る前に変換できる。形式の正規化はここで確実に行う。'],
[1,'1.5','500ドルを超える返金は必ず人間の承認に回したい。確実に守らせる方法はどれか。',['ツール呼び出しをインターセプトする hook で該当する呼び出しをブロックし、人間へのエスカレーションに振り向ける','system prompt に上限額を太字で書く','ツールの description に「500ドル超は不可」と書く','上限超えの失敗例を few-shot で示す'],'保証された遵守が必要なビジネスルールは hook で強制する。プロンプトや説明文は確率的にしか効かない。'],
[1,'1.6','「レガシーコードベースにテストを追加する」という開放的なタスクの進め方として適切なのはどれか。',['まず構造を把握し、影響の大きい領域を特定してから、依存関係の発見に応じて変わる優先度付き計画を立てる','ファイル名のアルファベット順に全ファイルのテストを書く','固定の手順パイプラインを最初に決め、途中で変更しない','最初に見つけたファイルからすぐテストを書き始める'],'予測可能な作業は固定パイプライン（prompt chaining）、開放的な調査は動的・適応的な分解が向く。'],
[1,'1.6','14ファイルに及ぶPRを1回のパスでレビューさせると、ファイルによって深さがばらつき、指摘が矛盾する。最も適切な改善はどれか。',['ファイルごとのローカルレビューを行い、その後にファイル横断の統合パスを行う','より大きなコンテキストウィンドウのモデルに切り替える','同じ全体レビューを3回実行し、2回以上出た指摘だけ採用する','開発者にPRを小さく分割させる'],'注意の分散が原因なので、ファイル単位のパス＋横断パスに分ける。コンテキストの大きさは注意の質を解決しない。'],
[1,'1.7','昨日の名前付きセッションの調査を続けたい。使うのはどれか。',['`--resume <session-name>`','`--output-format json`','`/memory`','`-p`'],'`--resume` で名前付きセッションを再開できる。'],
[1,'1.7','セッションを中断している間に、対象コードが大きく書き換えられた。再開の方法として最も信頼できるのはどれか。',['構造化した要約を持たせて新しいセッションを始める（または変更されたファイルを伝えて該当部分を再分析させる）','何も伝えずにそのまま再開する','古いツール結果を信頼するよう指示して再開する','履歴を全部コピーして system prompt に貼る'],'古いツール結果は現状と食い違う。新規セッション＋構造化サマリーのほうが、古い結果を抱えた再開より信頼できる。'],
[1,'1.7','同じ分析結果を出発点に、2通りのリファクタリング方針を試して比較したい。適切な手段はどれか。',['`fork_session` で共通のベースラインから分岐させる','同じセッションで順番に両方を試す','`/compact` で履歴を圧縮してから試す','CLAUDE.md に両方の方針を書く'],'`fork_session` は共通ベースラインから分岐して別方向の探索を行うための仕組み。'],

[2,'2.1','`get_customer` と `lookup_order` の description がどちらも一文だけで、エージェントが頻繁に取り違える。最初に行うべき改善はどれか。',['各ツールの description に入力形式・クエリ例・エッジケース・類似ツールとの境界を書く','ツール選択の few-shot 例を system prompt に大量に入れる','ユーザー入力を解析して事前にツールを決めるルーティング層を作る','2つのツールを1つに統合する'],'ツールの description はモデルがツールを選ぶ主な手がかり。まず低コストで効果の高い説明の拡充から行う。'],
[2,'2.1','`analyze_content` と `analyze_document` という似た名前のツールがあり、誤ったほうが呼ばれる。適切な対処はどれか。',['名前を変更し、説明を書き直して役割の違いを明確にする','両方のツールを毎回呼ばせる','`tool_choice` を `"any"` にする','片方を system prompt で「使用禁止」と書く'],'名前や説明の重なりは誤ルーティングの原因。名前と説明で境界をはっきりさせる。'],
[2,'2.1','ツールの説明は十分なのに、特定の語が入力に含まれると決まって不適切なツールが選ばれる。次に調べるべきものはどれか。',['system prompt の文言が、キーワードとツールを意図せず結びつけていないか','モデルの `max_tokens`','`.mcp.json` のサーバー順序','会話履歴の長さ'],'system prompt の言い回しが、意図しないキーワード連想によるツール選択を生むことがある。'],
[2,'2.2','MCPツールが失敗時に「Operation failed」とだけ返すため、エージェントが適切に回復できない。改善はどれか。',['`isError` を立て、`errorCategory`・`isRetryable`・人が読める説明を含む構造化エラーを返す','失敗時は空の成功レスポンスを返す','エラー時は例外を投げてワークフロー全体を止める','同じ文言を3回繰り返して返す'],'エラーの種類（transient / validation / permission など）とリトライ可否を構造化して返すと、エージェントが適切に判断できる。'],
[2,'2.2','検索ツールの結果が空だったとき、エージェントが正しく判断するために必要な区別はどれか。',['アクセス失敗（タイムアウト等）と、正常に検索した結果の0件を区別して返す','どちらも空配列で返して統一する','どちらもエラーとして返す','0件のときは適当な既定値を返す'],'アクセス失敗はリトライの判断が必要で、有効な空結果は「該当なし」という情報。混同すると誤った結論になる。'],
[2,'2.2','返金期限切れなどビジネスルール違反で処理できないとき、ツールは何を返すべきか。',['`retriable: false` と、顧客に伝えられる説明','`isRetryable: true` を付けて再試行させる','理由を伏せた一般的なエラー','成功として返し、後で人間が修正する'],'ビジネスルール違反は再試行しても結果が変わらない。リトライ不可であることと顧客向けの説明を返す。'],
[2,'2.3','1つのエージェントに18個のツールを与えたところ、ツール選択の精度が落ちた。適切な設計はどれか。',['役割ごとにエージェントを分け、それぞれに必要な4〜5個に絞る','ツールを30個に増やして選択肢を広げる','すべての description を短く削る','`tool_choice` を毎回強制指定する'],'ツールが多すぎると選択が不安定になる。役割外のツールは誤用も招く（例: synthesis エージェントが web 検索をする）。'],

var KEY='ccarf-drill-v1', stats={};
try{stats=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){stats={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
function plain(s){return s.replace(/`/g,'')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function idsOf(d){var r=[];Q.forEach(function(q,i){if(!d||q[0]===d)r.push(i)});return r}
function mastered(d){return idsOf(d).filter(function(i){return stats[i]&&stats[i].ok}).length}
function wrongIds(){return idsOf(0).filter(function(i){return stats[i]&&stats[i].ok===false})}

var app=document.getElementById('app'), S=null, timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null}}

function domButtons(){
  return [1,2,3,4,5].map(function(d){var n=idsOf(d).length,m=mastered(d);
    return '<button class="dom" style="--c:var(--d'+d+')" data-d="'+d+'"><b>'+d+'. '+D[d].n+'</b><span>配点 '+D[d].w+'%　正解済み '+m+' / '+n+'</span><div class="bar"><i style="width:'+(m/n*100)+'%"></i></div></button>';
  }).join('');
}
function home(){
  var w=wrongIds().length;
  app.innerHTML='<section class="card"><h2>試験の概要</h2>'+
  '<dl class="facts"><div><dt>試験時間</dt><dd>120分</dd></div><div><dt>問題数</dt><dd>60問</dd></div><div><dt>合格ライン</dt><dd>720 / 1000</dd></div><div><dt>出題形式</dt><dd>シナリオ型の選択式</dd></div></dl>'+
  '<p class="note">Claude Code 単独の認定試験はなく、Claude Code の出題比率が最も高い（20%）のがこの CCAR-F です。6つのシナリオから4つが出題されます。本アプリの問題は公式試験ガイドの出題範囲をもとにしたオリジナル問題で、実際の試験問題ではありません。</p></section>'+
  '<section class="card"><h2>分野別ドリル</h2><div class="list">'+domButtons()+'</div>'+
  '<div class="row"><button class="btn primary" id="all">全分野からランダム10問</button><button class="btn" id="wrong"'+(w?'':' disabled')+'>間違えた問題を復習（'+w+'問）</button></div></section>';
  bindDom();
  document.getElementById('all').onclick=function(){start(shuffle(idsOf(0)).slice(0,10),'drill','全分野ランダム')};
  document.getElementById('wrong').onclick=function(){start(shuffle(wrongIds()),'drill','間違えた問題')};
}
function drillMenu(){
  app.innerHTML='<section class="card"><h2>分野を選ぶ</h2><p class="note">1問ごとに正誤と解説が出ます。Claude Code に絞って学ぶなら分野3から始めてください。</p><div class="list">'+domButtons()+'</div></section>';
  bindDom();
}
function bindDom(){
  [].forEach.call(app.querySelectorAll('.dom'),function(b){b.onclick=function(){var d=+b.dataset.d;start(shuffle(idsOf(d)),'drill',D[d].n)}});
}
function mockMenu(){
  app.innerHTML='<section class="card"><h2>模擬試験</h2><p>20問・40分。本番と同じ配点比率（分野1から順に 5・4・4・4・3問）で出題し、解説は最後にまとめて表示します。</p>'+
  '<p class="note">本番の720点は換算スコアで、正答率とは一致しません。ここでは正答率72%以上を目安とします。</p>'+
  '<div class="row"><button class="btn primary" id="go">開始する</button></div></section>';
  document.getElementById('go').onclick=function(){
    var n={1:5,2:4,3:4,4:4,5:3},l=[];
    [1,2,3,4,5].forEach(function(d){l=l.concat(shuffle(idsOf(d)).slice(0,n[d]))});
    start(shuffle(l),'mock','模擬試験');

function notes(){
  app.innerHTML='<div class="notes list" style="gap:14px">'+[1,2,3,4,5].map(function(d){
    return '<section class="card" style="--c:var(--d'+d+')"><h2>'+d+'. '+D[d].n+'（'+D[d].w+'%）</h2><ul>'+NOTES[d].map(function(x){return '<li>'+fmt(x)+'</li>'}).join('')+'</ul></section>';
  }).join('')+'</div>';

function start(list,mode,label){
  if(!list.length)return;
  stopTimer();
  S={list:list,mode:mode,label:label,i:0,ans:[],ord:list.map(function(){return shuffle([0,1,2,3])}),left:40*60};
  if(mode==='mock'){timer=setInterval(function(){S.left--;var t=document.getElementById('clock');if(t)t.textContent=clock();if(S.left<=0)finish()},1000)}
  renderQ();
}
function clock(){var m=Math.floor(S.left/60),s=S.left%60;return '残り '+m+':'+(s<10?'0':'')+s}
function renderQ(){
  var id=S.list[S.i],q=Q[id],ord=S.ord[S.i],a=S.ans[S.i],done=a!==undefined,drill=S.mode==='drill';
  var h='<section class="card"><div class="meta"><span class="chip" style="--c:var(--d'+q[0]+')">'+q[1]+'　'+D[q[0]].n+'</span><span>'+S.label+'　'+(S.i+1)+' / '+S.list.length+(drill?'':'　<span id="clock">'+clock()+'</span>')+'</span></div>'+
  '<p class="q">'+fmt(q[2])+'</p><div class="list">';
  ord.forEach(function(o,k){
    var c='opt';
    if(done&&drill){if(o===0)c+=' ok';else if(o===a)c+=' ng'}
    else if(done&&o===a)c+=' sel';
    h+='<button class="'+c+'" data-o="'+o+'"'+(done&&drill?' disabled':'')+'><span class="k">'+'ABCD'[k]+'</span><span>'+fmt(q[3][o])+'</span></button>';
  });
  h+='</div>';
  if(done&&drill){
    h+='<div class="exp'+(a===0?'':' miss')+'"><b>'+(a===0?'正解':'不正解')+'</b>'+fmt(q[4])+'</div>';
  }
  h+='<div class="row">';
  if(done||!drill)h+='<button class="btn primary" id="next"'+(done?'':' disabled')+'>'+(S.i+1<S.list.length?'次の問題':'結果を見る')+'</button>';
  if(done&&drill)h+='<button class="btn" id="ask">Claudeに質問する用にコピー</button>';
  h+='<button class="btn" id="quit">やめる</button></div><div id="copyout"></div></section>';
  app.innerHTML=h;
  [].forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    var o=+b.dataset.o;S.ans[S.i]=o;
    if(drill){stats[id]={ok:o===0};save()}
    renderQ();
  }});
  var n=document.getElementById('next');if(n)n.onclick=function(){if(S.i+1<S.list.length){S.i++;renderQ();window.scrollTo(0,0)}else finish()};
  var k=document.getElementById('ask');if(k)k.onclick=function(){copyAsk(id,ord,a)};
  document.getElementById('quit').onclick=function(){stopTimer();S=null;route()};
}
function askText(id,ord,a){
  var q=Q[id];
  return 'Claude Certified Architect – Foundations (CCAR-F) の試験対策をしています。次の問題について、なぜその選択肢が正解で他が不正解なのかを、具体例を交えて日本語で詳しく教えてください。\n\n【分野】'+D[q[0]].n+'（タスク '+q[1]+'）\n【問題】'+plain(q[2])+'\n'+
  ord.map(function(o,k){return 'ABCD'[k]+'. '+plain(q[3][o])}).join('\n')+
  '\n【正解】'+'ABCD'[ord.indexOf(0)]+(a!==undefined?'\n【私の解答】'+'ABCD'[ord.indexOf(a)]:'')+'\n【解説】'+plain(q[4]);
}
function copyAsk(id,ord,a){
  var t=askText(id,ord,a),out=document.getElementById('copyout');
  function fallback(){out.innerHTML='<p class="note">自動コピーできませんでした。下の文章を選択してコピーしてください。</p><textarea id="asktext" readonly></textarea>';document.getElementById('asktext').value=t}
  try{navigator.clipboard.writeText(t).then(function(){out.innerHTML='<p class="note">コピーしました。Claude のチャットに貼り付けて質問してください。</p>'},fallback)}catch(e){fallback()}
}
function finish(){
  stopTimer();
  var ok=0,by={},wrong=[];
  S.list.forEach(function(id,i){var q=Q[id],r=S.ans[i]===0;by[q[0]]=by[q[0]]||[0,0];by[q[0]][1]++;if(r){ok++;by[q[0]][0]++}else wrong.push(i);
    if(S.mode==='mock'){stats[id]={ok:r}}});
  save();
  var pct=Math.round(ok/S.list.length*100);
  var h='<section class="card"><div class="meta"><span>'+S.label+'　結果</span></div><div class="score">'+ok+' / '+S.list.length+'　<span style="color:var(--'+(pct>=72?'good':'bad')+')">'+pct+'%</span></div>'+
  (S.mode==='mock'?'<p class="note">目安の72%'+(pct>=72?'を超えました。':'に届いていません。弱い分野をドリルで補強してください。')+'</p>':'')+
  '<div class="list">'+Object.keys(by).map(function(d){return '<div class="dom" style="--c:var(--d'+d+');cursor:default"><b>'+d+'. '+D[d].n+'</b><span>'+by[d][0]+' / '+by[d][1]+'</span><div class="bar"><i style="width:'+(by[d][0]/by[d][1]*100)+'%"></i></div></div>'}).join('')+'</div>'+
  '<div class="row"><button class="btn primary" id="back">ホームへ</button>'+(wrong.length?'<button class="btn" id="redo">間違えた'+wrong.length+'問をやり直す</button>':'')+'</div></section>';
  if(wrong.length){h+='<section class="card"><h2>間違えた問題</h2>'+wrong.map(function(i){var q=Q[S.list[i]],a=S.ans[i];
    return '<div class="list" style="gap:6px"><div><span class="chip" style="--c:var(--d'+q[0]+')">'+q[1]+'</span></div><p class="q">'+fmt(q[2])+'</p><p class="note">あなたの解答: '+(a===undefined?'未解答':fmt(q[3][a]))+'</p><div class="exp miss"><b>正解: '+fmt(q[3][0])+'</b>'+fmt(q[4])+'</div></div>'}).join('<hr style="border:0;border-top:1px solid var(--line);width:100%;margin:6px 0">')+'</section>'}
  app.innerHTML=h;
  var ids=wrong.map(function(i){return S.list[i]});
  S=null;
  document.getElementById('back').onclick=function(){if(location.hash==='#home')route();else location.hash='#home'};
  var r=document.getElementById('redo');if(r)r.onclick=function(){start(shuffle(ids),'drill','やり直し')};
  window.scrollTo(0,0);
}
function route(){
  stopTimer();S=null;
  var h=location.hash.replace('#','')||'home';
  [].forEach.call(document.querySelectorAll('#nav a'),function(a){if(a.getAttribute('href')==='#'+h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(h==='drill')drillMenu();else if(h==='mock')mockMenu();else if(h==='notes')notes();else home();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
