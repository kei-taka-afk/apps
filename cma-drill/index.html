<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>証券アナリスト ドリル</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d2433;--sub:#6b7280;--line:#e5e2da;--acc:#1f4e79;--acc2:#e8eef6;--red:#c2410c;--amb:#b7791f;--grn:#2f7d4f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom));}
header{padding:16px 18px 6px}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
header p{margin:2px 0 0;color:var(--sub);font-size:12px}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--sub);font-weight:600}
nav button.on{color:var(--acc)}
nav svg{display:block;margin:0 auto 3px;width:22px;height:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:700}
.bar{height:8px;border-radius:4px;background:#eee;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.subj{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;margin:12px 0 6px}
.subj small{color:var(--sub);font-weight:400}
.btn{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--acc);color:#fff;width:100%}
.btn.ghost{background:var(--acc2);color:var(--acc)}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font-size:15px;background:#fff;color:var(--ink)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin:10px 2px}
#stage{position:relative;min-height:340px;touch-action:pan-y}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.05);transition:transform .25s,opacity .25s;user-select:none}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);font-weight:600}
.q{font-size:16px;line-height:1.75;margin:12px 0;white-space:pre-wrap}
.mask{border:1.5px dashed #c9c4b8;border-radius:12px;padding:16px;text-align:center;color:var(--sub);font-size:14px;cursor:pointer;background:#faf9f6}
.ans{display:none}
.ans .a{font-size:17px;font-weight:700;color:var(--acc);margin:6px 0 10px;line-height:1.6}
.ans .e{font-size:14px;line-height:1.85;color:#374151;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:10px}
.revealed .mask{display:none}.revealed .ans{display:block}
.rate{display:flex;gap:8px;margin-top:12px}
.rate button{flex:1;border:0;border-radius:10px;padding:12px 4px;font-weight:700;font-size:14px;color:#fff}
.r0{background:var(--red)}.r1{background:var(--amb)}.r2{background:var(--grn)}
.hint{text-align:center;font-size:11px;color:var(--sub);margin-top:8px}
.stamp{position:absolute;top:16px;right:16px;font-weight:800;font-size:18px;padding:4px 10px;border:3px solid;border-radius:8px;opacity:0;transform:rotate(8deg)}
.ai{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.ai summary{padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;list-style:none;color:var(--acc)}
.ai summary::-webkit-details-marker{display:none}
.ai .inner{padding:0 14px 14px}
.ai textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;resize:vertical}
.ai .out{font-size:14px;line-height:1.85;white-space:pre-wrap;margin-top:10px;color:#374151}
.ai .log .u{font-weight:700;margin-top:10px;font-size:13px;color:var(--sub)}
.list .it{padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6;cursor:pointer}
.list .it:last-child{border:0}
.st{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle;background:#d6d3cc}
.st.s0{background:var(--red)}.st.s1{background:var(--amb)}.st.s2{background:var(--grn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border:0}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d1d5db;border-radius:14px;transition:.2s}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--acc)}.sw input:checked+span:before{transform:translateX(18px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{max-width:360px;width:100%}
.empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<header><h1>証券アナリスト ドリル</h1><p>CMA 第1次レベル｜証券分析・財務分析・経済・倫理</p></header>
<main>

<section id="v-home" class="view on">
  <div class="box">
    <div style="font-size:13px;color:var(--sub)">完了したカード</div>
    <div><span class="big" id="h-done">0</span> <span style="color:var(--sub)">/ <span id="h-total">0</span></span></div>
    <div class="bar" style="margin-top:10px" id="h-bar"></div>
    <div class="legend"><span><i class="dot" style="background:var(--grn)"></i>完了</span><span><i class="dot" style="background:var(--amb)"></i>要復習</span><span><i class="dot" style="background:var(--red)"></i>わからない</span></div>
  </div>
  <div class="box" id="h-subj"></div>
  <button class="btn" id="h-go">学習をはじめる</button>
  <div style="height:8px"></div>
  <button class="btn ghost" id="h-rev">「わからない」「要復習」だけ復習</button>
</section>

<section id="v-study" class="view">
  <select id="unitSel"></select>
  <div class="meta"><span id="s-pos"></span><span id="s-filter"></span></div>
  <div id="stage"></div>
  <details class="ai" id="aiBox">
    <summary>💬 このカードについてAIに質問</summary>
    <div class="inner">
      <div class="log" id="aiLog"></div>
      <textarea id="aiIn" placeholder="わからないところを書いてください"></textarea>
      <div style="height:8px"></div>
      <button class="btn" id="aiSend">AIに質問</button>
      <div class="out" id="aiNote" style="color:var(--sub);font-size:12px"></div>
    </div>
  </details>
</section>

<section id="v-cards" class="view">
  <select id="cardUnit"></select>
  <div class="chips" id="cardChips"></div>
  <div class="box list" id="cardList"></div>
</section>

<section id="v-set" class="view">
  <div class="box">
    <div class="row"><span>カードをシャッフル</span><label class="sw"><input type="checkbox" id="optShuffle"><span></span></label></div>
    <div class="row"><span>「完了」のカードを出さない</span><label class="sw"><input type="checkbox" id="optSkip" checked><span></span></label></div>
    <div class="row"><span>答えを最初から表示</span><label class="sw"><input type="checkbox" id="optOpen"><span></span></label></div>
  </div>
  <div class="box" style="font-size:13px;color:var(--sub);line-height:1.8">
    操作：カードを <b>右スワイプ＝完了</b>／<b>上スワイプ＝要復習</b>／<b>左スワイプ＝わからない</b>。タップで答えを表示。<br>
    進み具合はこの端末のブラウザに保存されます（別の端末とは共有されません）。<br>
    問題は公式テキストの範囲をもとにした自作問題です。数値や用語は公式テキストでも確認してください。
  </div>
  <button class="btn ghost" id="resetBtn" style="color:var(--red)">理解度をすべてリセット</button>
</section>

</main>

<nav>
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-v="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 3h8"/></svg>Study</button>
  <button data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Cards</button>
  <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setting</button>
</nav>

<div class="modal" id="modal"><div class="box"><div id="mText" style="font-size:15px;line-height:1.7;margin-bottom:14px"></div><div style="display:flex;gap:8px"><button class="btn ghost" id="mNo">キャンセル</button><button class="btn" id="mYes" style="background:var(--red)">リセット</button></div></div></div>

<script>
const SUBJECTS=[
 {name:"証券分析とポートフォリオ・マネジメント",units:["債券分析","株式分析","ポートフォリオ理論","デリバティブ","パフォーマンス評価"]},
 {name:"財務分析",units:["会計の基礎","収益性・安全性分析","キャッシュフローと企業価値"]},
 {name:"経済",units:["ミクロ経済","マクロ経済","金融・国際経済"]},
 {name:"職業倫理",units:["職業倫理・行為基準"]}
];
const C=[
// 債券分析
["債券分析","額面100円・クーポン年4%・残存3年の利付債が100円で取引されている。最終利回り（複利）は？","4%","価格が額面と等しい（パー）債券では、最終利回りはクーポンレートと一致します。\n価格が額面より低い（アンダーパー）なら利回り＞クーポン、高い（オーバーパー）なら利回り＜クーポンになります。"],
["債券分析","クーポン2円、価格98円、残存4年の利付債の単利最終利回り（日本式）は？","約2.55%","単利最終利回り＝｛クーポン＋（額面−価格）÷残存年数｝÷価格\n＝｛2＋(100−98)÷4｝÷98＝2.5÷98≒2.55%\n分子の（100−98）/4 は「償還差益を毎年に均等に割り振った分」です。"],
["債券分析","マコーレー・デュレーションが5.0年、最終利回りが4%（年1回利払い）の債券の修正デュレーションは？","約4.81年","修正デュレーション＝マコーレー・デュレーション÷(1＋利回り)\n＝5.0÷1.04≒4.81年\n修正デュレーションは「利回りが1%動いたとき価格が何%動くか」を表す感応度です。"],
["債券分析","修正デュレーション4.81年の債券で、利回りが0.5%上昇したときの価格変化率（デュレーションによる近似）は？","約−2.40%","価格変化率≒−修正デュレーション×利回り変化\n＝−4.81×0.005≒−2.40%\n金利上昇で価格は下落するのでマイナスになります。"],
["債券分析","割引債（ゼロクーポン債）のマコーレー・デュレーションはどうなる？","残存期間と等しい","マコーレー・デュレーションはキャッシュフローの現在価値で加重平均した「回収までの平均期間」です。割引債は満期の一回しかキャッシュフローがないため、残存期間そのものになります。\n利付債はクーポン受取りがある分、残存期間より短くなります。"],
["債券分析","通常の（凸性が正の）債券で、デュレーションだけを使って価格変化を近似すると、金利が上がる場合・下がる場合それぞれ実際の価格と比べてどうなる？","どちらの場合も実際の価格より低く見積もる","価格−利回り曲線は下に凸なので、接線（デュレーション近似）は常に曲線の下側にきます。\n・金利上昇時：実際の下落幅は近似より小さい\n・金利低下時：実際の上昇幅は近似より大きい\nこのズレを補正するのがコンベクシティ項（＋½×コンベクシティ×Δy²）です。"],
["債券分析","1年スポットレート2%、2年スポットレート3%のとき、1年後から1年間のインプライド・フォワードレートは？","約4.01%","(1.03)²＝(1.02)×(1＋f) を解きます。\nf＝1.0609÷1.02−1≒4.01%\n純粋期待仮説では、このフォワードレートが「1年後の1年金利の予想」と解釈されます。"],
// 株式分析
["株式分析","次期配当50円、要求収益率8%、配当成長率3%（一定）の株式の理論価格は？（定率成長配当割引モデル）","1,000円","P＝D₁÷(r−g)＝50÷(0.08−0.03)＝1,000円\n分子は「次期」の配当（D₁）である点に注意。今期配当D₀が与えられたら D₁＝D₀×(1＋g) に直してから使います。"],
["株式分析","配当性向40%、要求収益率8%、成長率3%のとき、予想利益ベースの理論PERは？","8倍","P＝D₁/(r−g) の両辺を予想EPS（E₁）で割ると\nPER＝配当性向÷(r−g)＝0.4÷0.05＝8倍\n成長率が高いほど、要求収益率が低いほどPERは高くなります。"],
["株式分析","ROE10%、配当性向30%の企業のサステイナブル成長率は？","7%","サステイナブル成長率 g＝ROE×内部留保率\n＝10%×(1−0.3)＝7%\n外部資金に頼らず、利益の再投資だけで達成できる成長率です。"],
["株式分析","売上高純利益率5%、総資産回転率1.2回、財務レバレッジ（総資産÷自己資本）2倍の企業のROEは？","12%","デュポン分解：ROE＝売上高純利益率×総資産回転率×財務レバレッジ\n＝5%×1.2×2＝12%\nどの要因でROEが高いのか（収益性・効率性・負債活用）を分けて見るための式です。"],
["株式分析","PER15倍、ROE8%の企業のPBRは？","1.2倍","PBR＝株価/BPS、PER＝株価/EPS、ROE＝EPS/BPS なので\nPBR＝PER×ROE＝15×0.08＝1.2倍\nROEが株主資本コストを上回る企業ほどPBRは1倍を超えやすくなります。"],
// ポートフォリオ理論
["ポートフォリオ理論","資産A（σ=20%）に60%、資産B（σ=10%）に40%投資。相関係数0のときポートフォリオの標準偏差は？","約12.65%","σp²＝wA²σA²＋wB²σB²＋2wAwBρσAσB\n＝0.36×0.04＋0.16×0.01＋0＝0.016\nσp＝√0.016≒12.65%\n加重平均（16%）より小さいのが分散投資の効果です。"],
["ポートフォリオ理論","無リスク金利1%、市場ポートフォリオの期待リターン6%、β=1.2の株式のCAPMによる期待リターンは？","7%","E(R)＝rf＋β×(E(RM)−rf)\n＝1%＋1.2×(6%−1%)＝7%\n(E(RM)−rf) を市場リスクプレミアムと呼びます。"],
["ポートフォリオ理論","ある株式と市場ポートフォリオの共分散が0.03、市場の標準偏差が20%のとき、この株式のβは？","0.75","β＝Cov(Ri,RM)÷Var(RM)＝0.03÷0.2²＝0.03÷0.04＝0.75\n相関係数を使う形では β＝ρ×σi÷σM と書けます。"],
["ポートフォリオ理論","銘柄数を増やして分散投資すると消去できるリスクと、消去できずに残るリスクは？","消去できる：非システマティック（固有）リスク／残る：システマティック（市場）リスク","個別企業の事情によるリスクは銘柄同士で打ち消し合いますが、景気や金利など市場全体に共通するリスクは残ります。\nCAPMでは、消去できるリスクには報酬（リスクプレミアム）が与えられず、βで測るシステマティック・リスクにだけプレミアムがつくと考えます。"],
["ポートフォリオ理論","資本市場線（CML）と証券市場線（SML）の違いは？（横軸と、対象となる資産）","CML：横軸σ、効率的ポートフォリオのみ／SML：横軸β、すべての資産・ポートフォリオ","CMLは無リスク資産と市場ポートフォリオの組合せで、総リスク（標準偏差）と期待リターンの関係を表します。\nSMLはCAPMを図にしたもので、個別証券を含むすべての資産がβに応じて線上に並びます。"],
["ポートフォリオ理論","σA=20%、σB=10%で相関係数が−1の2資産。リスクをゼロにするには資産Aにいくら配分する？","1/3（約33.3%）","ρ=−1 のとき σp＝|wAσA−wBσB| となるので、wAσA＝(1−wA)σB を解きます。\nwA＝σB÷(σA＋σB)＝10÷30＝1/3\n完全に逆に動く2資産なら、組み合わせ方次第でリスクを消せます。"],
// デリバティブ

$("unitSel").value=S.unit;

// home
function counts(list){const r={0:0,1:0,2:0,n:0};list.forEach(c=>{const s=S.st[c.id];if(s===undefined)r.n++;else r[s]++});return r;}
function barHTML(r,t){return '<i style="width:'+(r[2]/t*100)+'%;background:var(--grn)"></i><i style="width:'+(r[1]/t*100)+'%;background:var(--amb)"></i><i style="width:'+(r[0]/t*100)+'%;background:var(--red)"></i>';}
function renderHome(){const r=counts(CARDS);$("h-done").textContent=r[2];$("h-total").textContent=CARDS.length;$("h-bar").innerHTML=barHTML(r,CARDS.length);
 let h="";SUBJECTS.forEach(s=>{const l=CARDS.filter(c=>s.units.includes(c.unit));const k=counts(l);h+='<div class="subj">'+s.name+'<small>'+k[2]+' / '+l.length+'</small></div><div class="bar">'+barHTML(k,l.length)+'</div>'});$("h-subj").innerHTML=h;}
$("h-go").onclick=()=>{buildDeck();show("study")};
$("h-rev").onclick=()=>{S.unit="review";$("unitSel").value="review";save();buildDeck();show("study")};

// study
let deck=[],pos=0,revealed=false;
function buildDeck(){const u=S.unit;let l=CARDS.filter(c=>u==="all"||(u==="review"?(S.st[c.id]===0||S.st[c.id]===1):c.unit===u));
 if(S.opt.skip&&u!=="review")l=l.filter(c=>S.st[c.id]!==2);
 if(S.opt.shuffle){l=l.slice();for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}}
 deck=l;pos=0;renderCard();}
$("unitSel").onchange=e=>{S.unit=e.target.value;save();buildDeck()};
const LBL=["わからない","要復習","完了"],COL=["var(--red)","var(--amb)","var(--grn)"];
function renderCard(){const st=$("stage");resetAI();
 $("s-filter").textContent=S.opt.skip&&S.unit!=="review"?"完了は非表示":"";
 if(!deck.length){$("s-pos").textContent="";st.innerHTML='<div class="empty">この単元で出すカードはありません 🎉<br>別の単元を選ぶか、Setting で「完了のカードを出さない」をオフにしてください。</div>';$("aiBox").style.display="none";return;}
 if(pos>=deck.length){$("s-pos").textContent="";const r=counts(deck);st.innerHTML='<div class="box empty" style="padding:30px 16px">この単元を一周しました！<br>完了 '+r[2]+'／要復習 '+r[1]+'／わからない '+r[0]+'<div style="height:14px"></div><button class="btn" id="again">もう一周する</button></div>';$("again").onclick=buildDeck;$("aiBox").style.display="none";return;}
 $("aiBox").style.display="";
 const c=deck[pos];revealed=S.opt.open;const cur=S.st[c.id];
 $("s-pos").textContent=(pos+1)+" / "+deck.length;
 st.innerHTML='<div class="qcard'+(revealed?" revealed":"")+'" id="qc"><div class="stamp" id="stamp"></div><span class="tag">'+c.unit+'</span>'+(cur!==undefined?' <span class="tag" style="background:#f3f1ec;color:'+COL[cur]+'">前回：'+LBL[cur]+'</span>':'')+'<div class="q">'+c.q+'</div><div class="mask" id="mask">タップして答えを見る</div><div class="ans"><div class="a">'+c.a+'</div><div class="e">'+c.e+'</div></div><div class="rate"><button class="r0" data-r="0">わからない</button><button class="r1" data-r="1">要復習</button><button class="r2" data-r="2">完了</button></div><div class="hint">← わからない ｜ ↑ 要復習 ｜ 完了 →</div></div>';
 $("mask").onclick=()=>{$("qc").classList.add("revealed");revealed=true};
 st.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>rate(+b.dataset.r));
 attachSwipe($("qc"));}
function rate(r,dir){const c=deck[pos];if(!c)return;S.st[c.id]=r;save();const el=$("qc");
 const t=dir||["translateX(-120%) rotate(-12deg)","translateY(-120%)","translateX(120%) rotate(12deg)"][r];
 el.style.transform=t;el.style.opacity="0";setTimeout(()=>{pos++;renderCard()},220);}
function attachSwipe(el){let x0,y0,dx=0,dy=0,drag=false;const stamp=$("stamp");
 el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;x0=e.clientX;y0=e.clientY;drag=true;dx=dy=0;el.style.transition="none"});
 el.addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-x0;dy=e.clientY-y0;if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
  if(Math.abs(dx)>Math.abs(dy)||dy<0){e.preventDefault();el.style.transform="translate("+dx+"px,"+Math.min(dy,0)+"px) rotate("+dx/20+"deg)";
   const r=pick(dx,dy);stamp.style.opacity=r===null?0:Math.min(1,Math.max(Math.abs(dx),-dy)/120);if(r!==null){stamp.textContent=LBL[r];stamp.style.color=stamp.style.borderColor=COL[r];}}});
 const end=()=>{if(!drag)return;drag=false;el.style.transition="";const r=pick(dx,dy);
  if(r!==null&&(Math.abs(dx)>90||dy<-90))rate(r);else{el.style.transform="";stamp.style.opacity=0;}};
 el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);}
function pick(dx,dy){if(-dy>Math.abs(dx)&&dy<-20)return 1;if(dx>20)return 2;if(dx<-20)return 0;return null;}

// AI
let sample=null,aiHist=[],aiBusy=false;
(async()=>{try{sample=await window.claude?.use("sample")}catch(e){sample=null}if(!sample){$("aiNote").textContent="このビューではAIに質問できません。claude.ai 上でこのページを開くと使えます。";$("aiSend").disabled=true;$("aiSend").style.opacity=.5;}})();
function resetAI(){aiHist=[];$("aiLog").innerHTML="";$("aiIn").value="";$("aiBox").open=false;}
$("aiSend").onclick=async()=>{const q=$("aiIn").value.trim();if(!q||aiBusy||!sample)return;const c=deck[pos];if(!c)return;aiBusy=true;
 const log=$("aiLog");const u=document.createElement("div");u.className="u";u.textContent="Q. "+q;const o=document.createElement("div");o.className="out";o.textContent="考え中…";log.append(u,o);$("aiIn").value="";
 const sys="あなたは日本証券アナリスト協会の証券アナリスト（CMA）試験の家庭教師です。学習者は次の問題カードを学習中です。\n単元："+c.unit+"\n問題："+c.q+"\n答え："+c.a+"\n解説："+c.e+"\n\n学習者の質問に日本語で、やさしく正確に答えてください。計算は途中式を示してください。カードの内容に誤りがあれば遠慮なく指摘してください。スマホで読むので簡潔に（目安300字以内、必要なら長くても可）。Markdownの記号（#や**）は使わないでください。";
 const msgs=[];aiHist.forEach(m=>msgs.push(m));msgs.push({role:"user",content:(aiHist.length?"":sys+"\n\n質問：")+q});
 try{const r=await sample(msgs,{cache:false,onText:({text})=>{o.textContent=text}});o.textContent=r.text;aiHist.push({role:"user",content:msgs[msgs.length-1].content},{role:"assistant",content:r.text});}
 catch(e){o.textContent=e&&e.code==="not_granted"?"AIの利用が許可されていません。":e&&e.code==="rate_limited"?"混み合っています。少し待ってからもう一度どうぞ。":"エラーが発生しました。もう一度お試しください。";}
 aiBusy=false;};

// cards
let cf="all";
const CH=[["all","すべて"],["n","未学習"],["0","わからない"],["1","要復習"],["2","完了"]];
function renderCards(){$("cardChips").innerHTML=CH.map(([k,l])=>'<button data-k="'+k+'" class="'+(cf===k?"on":"")+'">'+l+'</button>').join("");
 $("cardChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{cf=b.dataset.k;renderCards()});
 const u=$("cardUnit").value;const l=CARDS.filter(c=>(u==="all"||c.unit===u)&&(cf==="all"||(cf==="n"?S.st[c.id]===undefined:S.st[c.id]===+cf)));
 $("cardList").innerHTML=l.length?l.map(c=>'<div class="it" data-id="'+c.id+'"><span class="st s'+(S.st[c.id]??"")+'"></span>'+c.q+'</div>').join(""):'<div class="empty">該当するカードはありません</div>';
 $("cardList").querySelectorAll(".it").forEach(d=>d.onclick=()=>{const c=CARDS[+d.dataset.id];deck=[c];pos=0;S.unit=c.unit;$("unitSel").value=c.unit;show("study");renderCard();});}
$("cardUnit").onchange=renderCards;

// settings
[["optShuffle","shuffle"],["optSkip","skip"],["optOpen","open"]].forEach(([id,k])=>{$(id).checked=!!S.opt[k];$(id).onchange=e=>{S.opt[k]=e.target.checked;save();buildDeck()}});
$("resetBtn").onclick=()=>{$("mText").textContent="すべてのカードの理解度をリセットします。よろしいですか？";$("modal").classList.add("on")};
$("mNo").onclick=()=>$("modal").classList.remove("on");
$("mYes").onclick=()=>{S.st={};save();$("modal").classList.remove("on");buildDeck();renderHome();};

renderHome();
</script>
</body>
</html>
