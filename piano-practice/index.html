<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピアノ練習カード</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#22211f; --sub:#6b675f; --line:#e2ded5;
    --rh:#2f6fd6; --rh-soft:#dce8fb; --lh:#d9772b; --lh-soft:#fbe7d6;
    --ped:#6a4fb3; --ped-soft:#e9e3f7; --acc:#22211f; --ok:#2e8b57;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1b1a18; --card:#262522; --ink:#eeeae2; --sub:#a8a398; --line:#3a3833;
      --rh:#6fa0f0; --rh-soft:#24344f; --lh:#f0a062; --lh-soft:#4a3322; --ped:#a990ea; --ped-soft:#352d4a; --acc:#eeeae2; --ok:#5fc08a;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 11px;font-size:.9rem;cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--rh);border-color:var(--rh);color:#fff;font-weight:600}
  .btn.icon{padding:6px 10px}
  .btn:disabled{opacity:.35}
  .hidden{display:none!important}
  .sub{color:var(--sub);font-size:.82rem;margin:0}

  /* ===== home ===== */
  #home{max-width:760px;margin:0 auto;padding:16px 12px 40px}
  #home h1{font-size:1.25rem;margin:4px 0 2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
  .piece{display:flex;gap:12px;align-items:center;cursor:pointer}
  .ghead{font-size:.9rem;color:var(--sub);margin:18px 2px 0;font-weight:700}
  .piece .ic{width:44px;height:44px;border-radius:12px;background:var(--rh-soft);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
  .piece h2{font-size:1rem;margin:0}
  .prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
  .prog div{height:100%;background:var(--ok)}

  /* ===== piece (one screen) ===== */
  #pieceView{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:6px 6px 0}
  .top{display:flex;align-items:center;gap:6px;flex:none}
  .top select{flex:1;min-width:0;font:inherit;font-size:.85rem;padding:6px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .stage{flex:1;min-height:0;margin:0 0 calc(6px + env(safe-area-inset-bottom));perspective:1600px}
  .face{transition:visibility 0s .3s}
  .stage.flipped .front{visibility:hidden}
  .stage:not(.flipped) .back{visibility:hidden}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
  .stage.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .face.back{transform:rotateY(180deg);display:flex;flex-direction:column}
  @media (prefers-reduced-motion: reduce){ .flip-inner{transition:none} }
  /* wide screens (iPad etc.): score and explanation side by side */
  @media (min-width:880px){
    #pieceView{max-width:1500px}
    .stage{perspective:none}
    .flip-inner{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:8px;transform:none!important;transition:none}
    .face{position:relative;inset:auto;transform:none!important;visibility:visible!important;height:100%}
    .face.back{transform:none!important}
    #flipToBack,#flipToFront{display:none}
  }

  .front{background:#fff;user-select:none;-webkit-user-select:none}
  .pscroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;scroll-snap-type:x mandatory;scrollbar-width:none}
  .pscroll::-webkit-scrollbar{display:none}
  .pscroll.zoomed{scroll-snap-type:none}
  .pages{display:flex}
  .slot{flex:none;display:flex;align-items:flex-end;padding-bottom:2px;box-sizing:border-box;justify-content:center;scroll-snap-align:start;scroll-snap-stop:always}
  .pages .score{position:relative;flex:none}
  .pages .score img{display:block;width:100%;height:100%}
  .pdots{white-space:nowrap;position:absolute;left:50%;bottom:3px;font-size:.62rem!important;transform:translateX(-50%);font-size:.7rem;color:#777;background:rgba(255,255,255,.85);border-radius:999px;padding:1px 9px;z-index:2;pointer-events:none}
  .pnum{position:absolute;right:4px;top:2px;font-size:10px;color:#999;background:#fff;padding:0 4px;border-radius:4px}
  .score{position:relative;transform-origin:0 0;will-change:transform}
  .score img{-webkit-user-drag:none;pointer-events:none}
  .zoomctl{display:none!important;position:absolute;right:6px;bottom:6px;z-index:2;display:flex;flex-direction:column;gap:4px}
  .zoomctl button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font-size:.9rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:0}
  .zoomctl button#zReset{font-size:.62rem}
  .score img{display:block;width:100%;height:100%}
  .bar-hit{position:absolute;border:2px solid transparent;border-radius:5px;background:transparent;cursor:pointer;padding:0}
  .bar-hit span{transform:scale(var(--zinv,1));transform-origin:0 0;position:absolute;left:1px;top:1px;font-size:9px;font-weight:700;color:#fff;background:#2f6fd6cc;border-radius:3px;padding:0 3px;line-height:13px}
  .bar-hit.cur{border:2px solid #2f6fd6;background:transparent}
  .notemark{position:absolute;top:3%;bottom:3%;border-radius:4px;pointer-events:none;border:2px solid #2f6fd6;background:rgba(47,111,214,.10)}
  .notemark.lh{border-color:#d9772b;background:rgba(217,119,43,.12)}
  .beatband{display:none!important;position:absolute;top:6%;bottom:6%;border:1px solid rgba(34,33,31,.12);border-radius:5px;background:rgba(47,111,214,.06);pointer-events:none;transition:left .12s}
  .bar-hit.nodata span{background:#8a857bcc}
  .bar-hit.done span{background:#2e8b57e6}

  /* back */
  .bk-head{flex:none;padding:5px 8px 3px;border-bottom:1px solid var(--line)}
  .bk-row{display:flex;align-items:center;gap:6px}
  .bk-row h3{font-size:.85rem;margin:0;white-space:nowrap}
  .bk-row .btn{padding:0 9px;height:26px;font-size:.85rem;border-radius:8px}
  .tag{font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .grow{flex:1;min-width:0}
  .chips{display:flex;gap:4px;overflow-x:auto;padding:4px 0 1px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:0 6px;font-size:.74rem;line-height:20px;cursor:pointer}
  .chips button.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
  .chips button.done{border-color:var(--ok);color:var(--ok);font-weight:700}
  .chips button.on.done{color:var(--bg);background:var(--ok)}
  .chips button.nodata{opacity:.55}
  .bk-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:6px 10px 8px;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  body.lock{overflow:hidden;position:fixed;inset:0;width:100%}
  .pedal{display:flex;align-items:center;gap:6px;font-size:.78rem}
  .pedal b{color:var(--ped);white-space:nowrap}
  .ped-line{display:grid;gap:2px;flex:1}
  .ped-line div{height:16px;border-radius:4px;background:var(--ped-soft);font-size:.64rem;display:flex;align-items:center;justify-content:center;color:var(--sub);white-space:nowrap;overflow:hidden}
  .ped-line div.down{background:var(--ped);color:#fff;font-weight:600}
  .fg{display:inline-block;min-width:1.3em;height:1.3em;line-height:1.3em;border-radius:50%;font-size:.64rem;text-align:center;margin-left:2px;vertical-align:.12em;font-weight:700;box-sizing:border-box}
  .fg.pr{background:var(--ink);color:var(--card)}
  .fg.sg{border:1px solid var(--sub);color:var(--sub);line-height:calc(1.3em - 2px)}
  .fg-legend{font-size:.7rem;color:var(--sub);margin:3px 0 0}
  .fg-legend .fg{margin:0 3px 0 0}
  .ped-text{font-size:.76rem;color:var(--sub);margin:2px 0 0}
  .beat{display:grid;grid-template-columns:1.6em 1fr;gap:2px 5px;margin-top:5px;padding:3px 4px;border-radius:8px;cursor:pointer}
  .beat.sel{outline:2px solid var(--acc)}
  .beat.playing{background:var(--rh-soft)}
  .beat .bn{grid-row:span 2;font-size:.8rem;font-weight:700;color:var(--sub);align-self:center;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
  .beat.sel .bn{color:var(--ink)}
  .beat.sel .bn::after{content:"▶";font-size:.55rem;color:var(--rh)}
  .line{display:flex;flex-wrap:wrap;gap:1px 4px;align-items:center;font-size:.92rem;border-radius:6px;padding:0 6px;line-height:1.55}
  .line.rh{background:var(--rh-soft)} .line.lh{background:var(--lh-soft)}
  .line{cursor:pointer;transition:opacity .15s}
  .arrow{color:var(--sub);font-size:.7rem}
  .nt{white-space:nowrap}
  .nt sub{font-size:.62em;color:var(--sub);margin-left:1px}
  .nt .warn{font-size:.62rem;color:var(--sub)}
  .chord{border:1px solid currentColor;border-radius:5px;padding:0 3px}
  .rest{color:var(--sub);font-size:.76rem}
  .grace{font-size:.78rem;color:var(--sub);border:1px dashed var(--line);border-radius:5px;padding:0 4px}
  .lenmark{font-size:.66rem;color:var(--sub)}
  .holdnote{display:block;width:100%;font-size:.7rem;color:var(--sub);line-height:1.3}
  .kbwrap{overflow:hidden;margin-top:6px}
  .kbwrap svg.kb{display:block;width:100%;height:auto;max-height:110px}
  .kbwrap::-webkit-scrollbar{display:none}
  .tip{font-size:.82rem;border-left:3px solid var(--rh);padding:0 0 0 8px;margin-top:6px}
  .psec{padding-bottom:6px}
  .endpad{height:55vh;color:var(--sub);font-size:.75rem;text-align:center;padding-top:16px}
  .phead{position:sticky;top:-6px;z-index:1;background:var(--card);font-size:.78rem;font-weight:700;color:var(--sub);padding:4px 0;border-bottom:2px solid var(--line)}
  .bar4{border-top:1px solid var(--line);padding:6px 0 4px;scroll-snap-align:start;scroll-margin-top:var(--pheadH,26px);min-height:var(--barH,auto);box-sizing:border-box}
  .bk-body.snap{scroll-snap-type:y mandatory}
  /* コツを閉じているときは拍の行が枠いっぱいに広がり、開くとその分だけ縮む */
  .bk-body.snap .bar4{display:flex;flex-direction:column}
  .bk-body.snap .bar4 .beat{flex:1 1 auto;grid-template-rows:1fr 1fr;align-content:stretch;min-height:0}
  .bk-body.snap .bar4 .line{align-content:center}
  .bk-body.snap .bar4 .tipd{flex:none}
  .bar4:first-of-type{border-top:0}
  .b4head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .b4head b{font-size:.9rem}
  .tipd summary{font-size:.75rem;color:var(--rh);cursor:pointer;margin-top:4px}
  .kbwrap.sticky{position:sticky;bottom:-8px;background:var(--card);padding:4px 0 6px;margin-top:4px;z-index:1}
  .nodata-msg{font-size:.88rem;color:var(--sub);margin:16px 4px}

  /* bottom bar */
  .bottom{flex:none;display:flex;align-items:center;gap:6px;padding:0 0 calc(8px + env(safe-area-inset-bottom))}
  .fronttop{position:absolute;left:50%;transform:translateX(-50%);top:4px;z-index:3;display:flex;gap:6px;align-items:center}
  .fronttop .btn{padding:3px 9px;font-size:.8rem;border-radius:9px;background:rgba(255,255,255,.92)}
  .homebtn{position:absolute;left:6px;top:4px;z-index:4;width:40px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.92);color:#2f6fd6}
  .fronttop .pager{background:rgba(255,255,255,.92)}
  .ptitle{font-size:.82rem;font-weight:700;color:#333;background:rgba(255,255,255,.92);padding:3px 9px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(42vw,300px)}
  .bk-ctrl{display:flex;align-items:stretch;gap:5px;margin-top:4px}
  .bk-ctrl>*{flex:1 1 0;min-width:0;height:30px;box-sizing:border-box}
  .bk-ctrl .btn{padding:0 4px;font-size:.8rem;border-radius:9px;display:flex;align-items:center;justify-content:center}
  .bk-ctrl .playmain{font-size:.9rem}
  .bk-ctrl .tsel{flex:0 0 auto;height:30px;border-radius:9px;justify-content:center;padding:0 8px;gap:4px}
  .bk-ctrl .tsel span{font-size:.8rem}
  .bk-ctrl .tsel select{font-size:.95rem;text-align:center;min-width:0;width:auto}
  .bk-ctrl .hidden{display:none}
  #setBtn{font-size:1rem}
  .ctrl{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;row-gap:6px}
  .ctrl .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .pager{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--card);height:30px;overflow:hidden}
  .pager button{border:0;background:transparent;width:26px;height:30px;font-size:1rem;cursor:pointer;color:var(--ink)}
  .pager button:disabled{opacity:.3}
  .pager select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.8rem;padding:0 2px;-webkit-appearance:none;appearance:none;text-align:center;max-width:9.5em}
  .ctrl .btn{padding:4px 9px;font-size:.8rem;border-radius:9px}
  .ctrl .playmain{min-width:44px;padding:4px 8px;font-size:.85rem}
  .flipmini{position:absolute;top:6px;right:6px;z-index:2;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:2px 9px;font-size:.74rem;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);white-space:nowrap}
  .flipmini.inline{position:static;box-shadow:none;padding:2px 7px;font-size:.7rem}
  .btn.hand{font-size:.78rem;padding:6px 7px;font-weight:700}
  .btn.hand.rh{border-color:var(--rh);background:var(--rh-soft);color:var(--rh)}
  .btn.hand.lh{border-color:var(--lh);background:var(--lh-soft);color:var(--lh)}
  .tsel{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;padding:0 2px 0 7px;background:var(--card);font-size:.8rem;height:30px}
  .tsel span{font-size:.75rem;color:var(--sub);white-space:nowrap}
  .tsel select{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.82rem;font-weight:700;padding:2px 0;-webkit-appearance:none;appearance:none}
  .btn.mode{font-size:.78rem;padding:6px 7px;border-color:var(--rh);color:var(--rh);font-weight:700}
  label.done{display:flex;align-items:center;gap:3px;font-size:.82rem;color:var(--ok);white-space:nowrap}
  .settings{position:fixed;right:12px;top:96px;width:min(320px,calc(100% - 16px));background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10}
  .settings h4{margin:0 0 8px;font-size:.9rem}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:var(--card);padding:5px 10px;font-size:.82rem;cursor:pointer}
  .seg button.on{background:var(--acc);color:var(--bg)}
  .srow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.82rem}
  .srow input[type=range]{flex:1}
  .settings .foot{font-size:.72rem;color:var(--sub);margin:10px 0 0}
  .settings ul{font-size:.76rem;padding-left:1.1em;margin:6px 0 0;color:var(--sub)}

  /* AI sheet */
  .ai-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.18);z-index:20}
  .ai-sheet{position:fixed;box-sizing:border-box;
    background:var(--card);border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,.25);z-index:21;display:flex;flex-direction:column;
    padding:0 12px 10px;animation:up .2s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
  .ai-grab{display:flex;justify-content:center;padding:8px 0 2px;cursor:grab;touch-action:none}
  .ai-grab span{width:40px;height:5px;border-radius:3px;background:var(--line)}
  .ai-head{display:flex;align-items:center;gap:8px}
  .ai-head b{flex:1;font-size:.95rem}
  .ai-close{border:0;background:var(--line);width:36px;height:36px;border-radius:50%;font-size:1.05rem;cursor:pointer;flex:none}
  .ai-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none;flex:none}
  .ai-chips::-webkit-scrollbar{display:none}
  .ai-chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer}
  .ai-log{flex:1;min-height:60px;overflow-y:auto;font-size:.9rem}
  .ai-msg{margin:6px 0;padding:8px 10px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
  .ai-msg.user{background:var(--rh-soft);margin-left:18%}
  .ai-msg.ai{background:var(--bg)}
  .ai-msg.err{color:#b3261e}
  .ai-empty{color:var(--sub);font-size:.82rem;margin:6px 2px}
  .ai-form{display:flex;gap:6px;padding-top:8px;flex:none}
  .ai-form textarea{flex:1;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;resize:none;background:var(--card);color:var(--ink);max-height:90px}
</style>
</head>
<body>
  <!-- ===== home ===== -->
  <section id="home">
    <h1>ピアノ練習カード</h1>
    <p class="sub">曲を選ぶと楽譜のページが開きます。ページを裏返すと、小節ごとの音名・ペダル・コツが出ます。</p>
    <div id="pieceList"></div>
    <div class="card sub">新しい曲を追加したいときは、楽譜のPDFをClaudeに送ってください。この一覧に曲が増えます。</div>
  </section>

  <!-- ===== piece ===== -->
  <section id="pieceView" class="hidden" style="position:relative">
    <div class="stage" id="stage">
      <div class="flip-inner">
        <div class="face front" id="front">
          <div class="pscroll" id="pscroll"><div class="pages" id="pages"></div></div>
          <button class="btn icon homebtn" id="backHome" aria-label="ホーム（曲一覧）へ" title="ホーム"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h5v-5h3v5h5v-9.5"/></svg></button>
          <div class="fronttop">
            <span class="ptitle" id="ptitle"></span>
            <div class="pager">
              <button id="prevPage" aria-label="前のページ">‹</button>
              <select id="pageSel" aria-label="ページを選ぶ"></select>
              <button id="nextPage" aria-label="次のページ">›</button>
            </div>
          </div>
          <div class="pdots hidden" id="pdots"></div>
          <button class="flipmini" id="flipToBack" aria-label="裏返して解説を見る">↻ 解説</button>
          <div class="zoomctl"><button id="zIn" aria-label="拡大">＋</button><button id="zOut" aria-label="縮小">－</button><button id="zReset" aria-label="等倍に戻す">等倍</button></div>
        </div>
        <div class="face back" id="back">
          <div class="bk-head">
            <div class="bk-row">
              <h3 id="bkTitle"></h3><span class="tag" id="bkDyn"></span><span class="grow"></span>
              <button class="flipmini inline" id="viewBtn" aria-label="表示する小節数を切り替え">ページ全体</button>
              <button class="flipmini inline" id="flipToFront" aria-label="楽譜に戻す">↺ 楽譜</button>
              <button class="btn icon" id="prevBar" aria-label="前の小節">‹</button>
              <button class="btn icon" id="nextBar" aria-label="次の小節">›</button>
            </div>
            <div class="bk-ctrl">
              <button class="btn primary playmain" id="playBtn" aria-label="再生">▶</button>
              <button class="btn icon mode" id="unitBtn" aria-label="再生の単位を切り替え">小節</button>
              <button class="btn icon hand" id="handBtn" aria-label="右手・左手を切り替え">両手</button>
              <label class="tsel"><span id="tempoUnit">テンポ</span><select id="tempoSel" aria-label="テンポ"></select></label>
              <button class="btn icon hidden" id="aiBtn" aria-label="AIに聞く">💬AI</button>
              <button class="btn icon" id="setBtn" aria-label="設定">⚙</button>
            </div>
            <div class="chips" id="chips"></div>
          </div>

<script>
(function(){
  const PIECES = window.PIANO_PIECES || [];
  const $ = id => document.getElementById(id);
  const store = {
    get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  const K = (p,k)=>"pianocards:"+k+":"+p.id;

  // ---------- notes ----------
  const JA={C:"ド",D:"レ",E:"ミ",F:"ファ",G:"ソ",A:"ラ",B:"シ"}, BASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const parse=s=>{const m=s.match(/^([A-G])(#|x|b|n)?(-?\d)$/);return {l:m[1],a:m[2]||"",o:+m[3]};};
  const midi=s=>{const p=parse(s);return (p.o+1)*12+BASE[p.l]+({"#":1,"x":2,"b":-1}[p.a]||0);};
  const fgHTML=x=>x?`<span class="fg ${x.p?"pr":"sg"}" title="${x.p?"楽譜の指番号":"おすすめの指番号"}">${x.f}</span>`:"";
  function fingers(fstr){
    if(!fstr) return null;
    const pf=x=>!x||x==="_"?null:x.split("+").map(y=>y==="_"?null:{f:y.replace("!",""),p:y.endsWith("!")});
    return fstr.split(" ").map(t=>{ const [a,b]=t.split("|"); return {n:pf(a),h:pf(b)}; });
  }
  function label(s,fg){
    const p=parse(s), acc={"#":"♯","x":"×","b":"♭","n":"♮"}[p.a]||"";
    const w = p.l==="E"&&p.a==="#"?"＝白鍵ファ": p.l==="B"&&p.a==="#"?"＝白鍵ド": p.l==="F"&&p.a==="x"?"＝白鍵ソ":
              p.l==="C"&&p.a==="b"?"＝白鍵シ": p.l==="F"&&p.a==="b"?"＝白鍵ミ": p.a==="n"?"白鍵":"";
    return `<span class="nt">${JA[p.l]}${acc}<sub>${p.o}</sub>${fgHTML(fg)}${w?`<span class="warn">（${w}）</span>`:""}</span>`;
  }
  const norm=beat=>beat.map(e=>Array.isArray(e)?{n:e,d:1/beat.length}:Object.assign({d:1/beat.length},e));
  const evHTML=(e,fe)=>{
    const fn=i=>fe&&fe.n?fe.n[i]:null;
    if(!e.n.length) return e.sus?`<span class="rest">（${e.sus.map(x=>label(x)).join("・")} を伸ばしたまま）</span>`:`<span class="rest">休み</span>`;
    const g=e.grace?`<span class="grace">装飾音 ${e.grace.map(x=>label(x)).join("・")}</span><span class="arrow">→</span>`:"";
    const uq=piece?(/付点4分/.test(piece.tempo.unit||"")?1.5:/2分/.test(piece.tempo.unit||"")?2:/8分/.test(piece.tempo.unit||"")?.5:1):1, bq=piece?uq*(piece.tempo.perBeat||1):1, ql=e.len?Math.round(e.len*bq*100)/100:0;   // 6/8 は1拍＝付点4分
    const L={1:"4分",1.5:"付点4分",2:"2分",3:"付点2分",4:"全音符",6:"付点全音符"}[ql];
    const main=e.n.length===1?label(e.n[0],fn(0)):`<span class="chord">${e.n.map((x,i)=>label(x,fn(i))).join("・")}</span>`;
    const tr=e.tr?`<span class="lenmark">（トリル：${label(e.tr[1])}と速く交互に）</span>`:"";
    return g+main+(L&&ql>=1?`<span class="lenmark">（${L}）</span>`:"")+tr;
  };
  function beatLine(beat,fstr){
    const evs=norm(beat), fs=fingers(fstr)||[];
    let s=evs.map((e,i)=>evHTML(e,fs[i])).join(`<span class="arrow">→</span>`);
    evs.forEach((e,i)=>{
      const len={1.5:"付点4分",2:"2分音符",4:"全音符"}[e.holdBeats]||(e.holdBeats+"拍");
      const hf=j=>fs[i]&&fs[i].h?fs[i].h[j]:null;
      if(e.hold) s+=`<span class="holdnote">＋下で ${e.hold.map((x,j)=>label(x,hf(j))).join("・")} を弾いて伸ばす（${len}）</span>`;
      if(e.tied) s+=`<span class="holdnote">※下の ${e.tied.map((x,j)=>label(x,hf(j))).join("・")} はタイで伸ばしたまま</span>`;
    });
    return s;
  }

  // ---------- keyboard ----------
  // keyboard covers only the range this piece uses, and always fits the card width
  let LO=28, HI=89; const WW=19, BW=12, WH=86, BH=54;
  const isBlack=m=>[1,3,6,8,10].includes(m%12);
  let keyPos={}, KW=0;
  function setKbRange(lo,hi){
    LO=lo; HI=hi; while(isBlack(LO)) LO--; while(isBlack(HI)) HI++;
    keyPos={}; KW=0;
    for(let m=LO;m<=HI;m++){ if(!isBlack(m)){ keyPos[m]={x:KW,b:false}; KW+=WW; } else keyPos[m]={x:KW-BW/2,b:true}; }
  }
  setKbRange(28,89);
  function kbRangeFor(p){
    let lo=127, hi=0;
    Object.values(p.bars).forEach(B=>[B.rh,B.lh].forEach(h=>h.forEach(beat=>norm(beat).forEach(e=>[...e.n,...(e.hold||[]),...(e.tied||[])].forEach(x=>{ const m=midi(x); if(m<lo) lo=m; if(m>hi) hi=m; })))));
    if(lo>hi){ lo=36; hi=84; }
    lo=Math.min(lo,48)-2; hi=Math.max(hi,72)+2;   // a little room around the notes
    setKbRange(lo,hi);
  }
  function kbSVG(rhS,lhS){
    const css=getComputedStyle(document.documentElement), rh=css.getPropertyValue("--rh").trim(), lh=css.getPropertyValue("--lh").trim();
    const fill=(m,d)=>rhS.has(m)&&lhS.has(m)?"url(#both)":rhS.has(m)?rh:lhS.has(m)?lh:d;
    let s=`<svg class="kb" viewBox="0 0 ${KW+1} ${WH+2}" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="both"><stop offset="50%" stop-color="${rh}"/><stop offset="50%" stop-color="${lh}"/></linearGradient></defs>`;
    for(let m=LO;m<=HI;m++){const k=keyPos[m]; if(k.b) continue;
      s+=`<rect x="${k.x+.5}" y="1" width="${WW-1}" height="${WH}" rx="3" fill="${fill(m,"#fff")}" stroke="#999"/>`;
      if(m===60) s+=`<circle cx="${k.x+WW/2}" cy="${WH-8}" r="3" fill="#888"/>`;
      if(m%12===0) s+=`<text x="${k.x+WW/2}" y="${WH-16}" font-size="7.5" text-anchor="middle" fill="#777">ド${m/12-1}</text>`;}
    for(let m=LO;m<=HI;m++){const k=keyPos[m]; if(!k.b) continue;
      s+=`<rect x="${k.x}" y="1" width="${BW}" height="${BH}" rx="2" fill="${fill(m,"#222")}" stroke="#111"/>`;}
    return s+"</svg>";
  }

  // ---------- state ----------
  let piece=null, pageIdx=0, barIdx=0, beatSel=0, flipped=false, hands="both", lastLineKey="";
  let ctx=null, timers=[], playing=false;
  const page=()=>piece.pages[pageIdx];
  const barNo=()=>page().bars[barIdx][0];
  const doneSet=()=>new Set(store.get(K(piece,"done"),[]));

  // ---------- home ----------
  function renderHome(){
    const card=p=>{
      const total=p.pages.reduce((a,pg)=>a+pg.bars.length,0), data=Object.keys(p.bars).length;
      return `<div class="card piece" data-id="${p.id}" role="button" tabindex="0"><div class="ic">♪</div>
        <div style="flex:1;min-width:0"><h2>${p.title}</h2><p class="sub">${p.composer}・${p.meta}</p>
        <p class="sub">全${total}小節／解説あり ${data}小節${data?"":"（楽譜のみ）"}</p></div></div>`;
    };
    const groups=[]; PIECES.forEach(p=>{ const g=p.group||""; let G=groups.find(x=>x.name===g); if(!G){ G={name:g,items:[]}; groups.push(G);} G.items.push(p); });
    $("pieceList").innerHTML=groups.map(G=>(G.name?`<h2 class="ghead">${G.name}</h2>`:"")+G.items.map(card).join("")).join("")||`<div class="card">まだ曲がありません。</div>`;
    document.querySelectorAll(".piece").forEach(el=>{
      const go=()=>{ location.hash=el.dataset.id; };
      el.addEventListener("click",go); el.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
    });
  }
  function showHome(){ stopPlay(); piece=null; document.body.classList.remove("lock"); $("pieceView").classList.add("hidden"); $("home").classList.remove("hidden"); renderHome(); }
  function openPiece(p){
    piece=p; pageIdx=Math.min(store.get(K(p,"page"),0),p.pages.length-1); barIdx=0; beatSel=0;
    $("home").classList.add("hidden"); $("pieceView").classList.remove("hidden"); document.body.classList.add("lock");
    $("ptitle").textContent=p.title.replace(/（.*?）/g,"").trim(); $("ptitle").title=p.title;
    $("pageSel").innerHTML=p.pages.map((pg,i)=>`<option value="${i}">p.${i+1}／${p.pages.length}</option>`).join("");
    kbRangeFor(p); fillTempo(p); $("sourceNote").textContent=p.source||""; setTimeout(()=>prerender(p),300);
    builtFor=null; shownGroup=null; zoom=1; setFlip(false,true); renderPage(); requestAnimationFrame(()=>scrollFrontTo(pageIdx,false));
  }
  function route(){ const p=PIECES.find(x=>x.id===location.hash.slice(1)); p?openPiece(p):showHome(); }
  window.addEventListener("hashchange",route);
  $("backHome").addEventListener("click",()=>{ history.replaceState(null,"",location.pathname+location.search); showHome(); });

  // ---------- page / front (all pages stacked, scroll inside the card) ----------
  let zoom=1, suppressTap=false, scrollLock=false, builtFor=null;
  const ZMAX=4;
  function setPage(i,keepFlip,toLast,fromScroll){
    if(i<0||i>=piece.pages.length) return;
    if(!fromScroll) stopPlay();
    pageIdx=i; store.set(K(piece,"page"),i); barIdx=toLast?piece.pages[i].bars.length-1:0; beatSel=0;
    if(!keepFlip) setFlip(false,true);
    renderPage(!fromScroll);
    if(view4&&!fromScroll) scrollToCursor(false,true);
  }
  $("prevPage").addEventListener("click",()=>setPage(pageIdx-1,flipped));
  $("nextPage").addEventListener("click",()=>setPage(pageIdx+1,flipped));
  $("pageSel").addEventListener("change",e=>setPage(+e.target.value,flipped));

  const isWide=()=>window.matchMedia("(min-width:880px)").matches;
  function baseW(){ return Math.max(200,$("front").clientWidth-8); }
  function slotSize(){ const sc=$("pscroll"); return {W:sc.clientWidth,H:sc.clientHeight}; }
  function layoutScore(){
    if(!piece) return;
    const {W,H}=slotSize();
    $("pages").querySelectorAll(".slot").forEach(sl=>{
      const pg=piece.pages[+sl.dataset.p], r=pg.h/pg.w, w=Math.min(W-2,(H-40)/r)*zoom;
      sl.style.width=W*zoom+"px"; sl.style.height=H*zoom+"px";
      const sc=sl.firstElementChild; sc.style.width=w+"px"; sc.style.height=w*r+"px";
    });
    $("pscroll").classList.toggle("zoomed",zoom>1);
    $("zReset").style.visibility=zoom>1?"visible":"hidden";
  }
  function showDots(){ if(piece) $("pdots").textContent=`${pageIdx+1} / ${piece.pages.length}　← スワイプでページ送り →`; }
  const IMGV="20261107u";   // 楽譜画像を差し替えたら変える（古い画像のキャッシュを使わないため）
  function buildFront(){
    const box=$("pages"); box.innerHTML="";
    piece.pages.forEach((pg,p)=>{
      const sl=document.createElement("div"); sl.className="slot"; sl.dataset.p=p;
      const sc=document.createElement("div"); sc.className="score"; sc.dataset.p=p; sl.appendChild(sc);
      sc.innerHTML=`<img src="${pg.img}?v=${IMGV}" data-p="${p}" alt="楽譜${p+1}ページ" ${p>1?'loading="lazy"':""} style="aspect-ratio:${pg.w}/${pg.h}">`;
      pg.bars.forEach(([n,x0,y0,x1,y1],i)=>{
        const b=document.createElement("button");
        b.className="bar-hit"+(piece.bars[n]?"":" nodata"); b.dataset.p=p; b.dataset.i=i;
        b.setAttribute("aria-label",`第${n}小節の解説`);
        Object.assign(b.style,{left:x0/pg.w*100+"%",top:y0/pg.h*100+"%",width:(x1-x0)/pg.w*100+"%",height:(y1-y0)/pg.h*100+"%"});
        b.innerHTML=`<span>${n}</span>`;
        b.addEventListener("click",e=>{
          if(suppressTap){ e.preventDefault(); return; }
          if(p!==pageIdx){ pageIdx=p; store.set(K(piece,"page"),p); renderPage(false); }
          barIdx=i; beatSel=0; renderBar(); setFlip(true); setTimeout(()=>scrollToCursor(false,true),60);
        });
        sc.appendChild(b);
      });
      box.appendChild(sl);
    });
    builtFor=piece.id; layoutScore();
  }
  function scrollFrontTo(p,smooth){
    const {W}=slotSize(); showDots();
    scrollLock=true; $("pscroll").scrollTo({left:p*W*zoom,top:zoom>1?$("pscroll").scrollTop:0,behavior:smooth?"smooth":"auto"});
    setTimeout(()=>scrollLock=false,smooth?600:60);

  $("aiBtn").addEventListener("click",openAI);
  $("aiClose").addEventListener("click",closeAI);
  $("aiBackdrop").addEventListener("click",closeAI);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("aiSheet").classList.contains("hidden")) closeAI(); });
  $("aiForm").addEventListener("submit",e=>{ e.preventDefault(); ask($("aiInput").value); });
  $("aiInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask($("aiInput").value); } });
  // swipe down on the handle / header closes
  let gy=null;
  ["aiGrab","aiTitle"].forEach(id=>{
    const el=id==="aiTitle"?$("aiTitle").parentElement:$(id);
    el.addEventListener("touchstart",e=>{ gy=e.touches[0].clientY; },{passive:true});
    el.addEventListener("touchmove",e=>{ if(gy==null) return; const dy=Math.max(0,e.touches[0].clientY-gy); $("aiSheet").style.transform=`translateY(${dy}px)`; },{passive:true});
    el.addEventListener("touchend",e=>{ if(gy==null) return; const dy=e.changedTouches[0].clientY-gy; gy=null; if(dy>70) closeAI(); else $("aiSheet").style.transform=""; },{passive:true});
  });
  // when the bar changes, close the card (it belongs to one bar)
  const _renderBar=renderBar;
  renderBar=function(){ _renderBar(); if(!$("aiSheet").classList.contains("hidden")&&aiBarKey!==piece.id+":"+barNo()) closeAI(); };

  (function waitClaude(tries){
    if(window.claude&&typeof window.claude.use==="function"){
      window.claude.use("sample").then(async s=>{
        if(!s) return; sample=s; $("aiBtn").classList.remove("hidden");
        try{ const lim=await s.limits(); imgOK=!!(lim&&lim.images); }catch(e){ imgOK=false; }
      }).catch(()=>{});
    } else if(tries<40) setTimeout(()=>waitClaude(tries+1),250);
  })(0);

  setHands(store.get("pianocards:hands","both"));
  renderHome(); route();
})();
</script>
</body>
</html>
