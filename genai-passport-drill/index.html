<script>const CH=["","AIの基礎と歴史","生成AI","AIエージェント","生成AIのリスク予防・AI倫理・ガバナンス","生成AIの実践と活用事例"];

"5-1":"プロンプトエンジニアリング","5-2":"文書作成・コミュニケーション","5-3":"企画・マーケティング","5-4":"クリエイティブ制作","5-5":"データ分析・リサーチ","5-6":"開発・業務自動化","5-7":"業種別の活用"};

/* [中項目, 問題文, 選択肢(先頭n個が正解。表示時にシャッフル), 解説, 正解数(省略時1)] */
const Q=[
// ---------- 第1章 ----------
["1-1","人間があらかじめ決めた条件や手順に従って判断するAIの仕組みはどれか。",["ルールベース","機械学習","強化学習","ディープラーニング"],"ルールベースは「もし〜なら〜する」という規則を人間が書く方式。データから規則を学ぶ機械学習と対比される。"],
["1-1","ルールベースのAIの限界として最も適切なものはどれか。",["例外や想定外の事例が増えると、ルールの追加と保守が難しくなる","大量の学習データがなければ動かない","判断の根拠を人間がまったく追えない","GPUなどの計算資源が必ず必要になる"],"現実の問題は例外が多く、すべてを規則として書き切れない。この限界が、データから学ぶ機械学習への発展につながった。"],
["1-1","AI・機械学習・ディープラーニングの関係として正しいものはどれか。",["AIの一分野が機械学習で、機械学習の一手法がディープラーニング","ディープラーニングの一分野がAIで、AIの一手法が機械学習","機械学習とディープラーニングは無関係な別技術","3つは同じ意味の言い換え"],"包含関係は AI ⊃ 機械学習 ⊃ ディープラーニング。"],
["1-1","機械学習の説明として最も適切なものはどれか。",["データからパターンや規則性を学習し、予測や判断を行う","人間が書いた規則だけに従って動作する","インターネットを検索して答えを探す","一度決めた動作を変えずに繰り返す"],"機械学習はデータから規則性を見つけ、学習済みモデルとして予測・判断に使う。"],
["1-2","正解ラベルが付いたデータを使ってモデルを学習させる手法はどれか。",["教師あり学習","教師なし学習","強化学習","次元削減"],"入力と正解（教師データ）の組から学ぶのが教師あり学習。分類と回帰が代表的なタスク。"],
["1-2","教師あり学習の「回帰」に当たる例はどれか。",["過去の実績から来月の売上金額を予測する","メールを迷惑メールかどうかに分ける","顧客を似た特徴ごとにグループ分けする","写真に写っている動物の種類を当てる"],"回帰は連続する数値を予測する。迷惑メール判定や動物の種類は分類、グループ分けは教師なし学習のクラスタリング。"],
["1-2","正解ラベルのないデータを、似たもの同士のグループに分ける手法はどれか。",["クラスタリング","回帰","二値分類","強化学習"],"クラスタリングは教師なし学習の代表例。正解を与えずにデータの構造を見つける。"],
["1-2","次元削減の説明として適切なものはどれか。",["データの情報をなるべく保ちながら、特徴の数を減らす","学習データの件数を減らす","モデルの層の数を減らす","正解ラベルの種類を減らす"],"次元削減は教師なし学習の一つで、多数の特徴を少数にまとめ、可視化や計算の効率化に使う。"],
["1-2","強化学習の説明として適切なものはどれか。",["試行錯誤を通じて、得られる報酬が最大になる行動の方針を学ぶ","正解ラベル付きのデータから入力と出力の対応を学ぶ","ラベルのないデータを似たもの同士に分ける","人間が書いた規則をそのまま実行する"],"強化学習はエージェントが環境の中で行動し、報酬を手がかりに方策（行動の方針）を改善していく。"],
["1-2","ノーフリーランチ定理が示す内容はどれか。",["あらゆる問題に対して常に最良となる万能なアルゴリズムは存在しない","学習データは多いほど必ず精度が上がる","無料のAIツールは業務で使ってはならない","モデルは大きいほど必ず性能が高い"],"問題ごとに適した手法は異なるため、目的やデータに合わせて手法を選ぶ必要がある。"],
["1-2","半教師あり学習の説明として適切なものはどれか。",["少量のラベル付きデータと大量のラベルなしデータを組み合わせて学習する","ラベル付きデータを半分だけ使って学習する","報酬を半分にして強化学習を行う","学習を途中で打ち切る"],"ラベル付けのコストを抑えながら、ラベルなしデータも活用する手法。"],
["1-2","二値分類の例として適切なものはどれか。",["受信したメールが迷惑メールかそうでないかを判定する","手書きの数字を0〜9のどれかに分ける","明日の最高気温を予測する","購買履歴から顧客をグループ分けする"],"二値分類は2つのクラスのどちらかに分ける。0〜9の判定は多値分類、気温予測は回帰。"],
["1-3","ニューラルネットワークの学習で、予測と正解のずれを数値で表すものはどれか。",["損失関数","活性化関数","ドロップアウト","潜在ベクトル"],"損失関数の値が小さくなるように重みを調整していくのが学習。"],
["1-3","誤差逆伝播法（バックプロパゲーション）の説明として適切なものはどれか。",["出力側の誤差を入力側へ向かって伝え、各重みをどれだけ修正すべきかを求める","入力データを逆順に並べ替えて学習する","学習済みモデルを別のタスクに転用する","学習を早めに打ち切って過学習を防ぐ"],"誤差逆伝播法で求めた勾配を使い、勾配降下法で重みを少しずつ更新する。"],
["1-3","過学習（オーバーフィッティング）の説明として適切なものはどれか。",["訓練データに合わせすぎて、未知のデータに対する性能が下がる","学習時間が長くなりすぎて処理が終わらない","学習データが少なすぎて何も学習できない","モデルが大きすぎてメモリに載らない"],"未知のデータにも対応できる力を汎化という。過学習は汎化が損なわれた状態。"],
["1-3","過学習への対策として適切なものを2つ選べ。",["ドロップアウト","アーリーストッピング","訓練データをできるだけ減らす","検証データを使わずに学習を続ける"],"ドロップアウト（一部のノードを無効化して学習）、アーリーストッピング（早期終了）、正則化が代表的な対策。",2],
["1-3","画像認識で広く使われ、「畳み込み」によって画像の特徴を取り出すモデルはどれか。",["CNN","RNN","LSTM","GAN"],"CNN（畳み込みニューラルネットワーク）はコンピュータビジョンの中心的なモデル。"],
["1-3","RNNが抱える勾配消失問題に対処し、長い系列の情報を保持しやすくしたモデルはどれか。",["LSTM","CNN","VAE","GAN"],"RNNは文章や時系列などのシーケンスデータを扱うが、系列が長いと学習が難しい。LSTMはその弱点を補う。"],
["1-3","GAN（敵対的生成ネットワーク）の仕組みとして適切なものはどれか。",["生成器と識別器が競い合うことで、本物に近いデータを作れるようになる","エンコーダで圧縮しデコーダで復元する","ノイズを少しずつ取り除いてデータを作る","注意機構で単語同士の関係を計算する"],"生成器は偽物を作り、識別器は本物か偽物かを見分ける。エンコーダとデコーダはVAE、ノイズ除去は拡散モデルの説明。"],

["3-2","リランキングの説明として適切なものはどれか。",["検索で得た候補を、質問との関連度でもう一度並べ替える","検索を最初からやり直す","文書を古い順に並べる","検索結果をランダムに並べる"],"最初の検索で広く集め、より精密な方法で順位を付け直して精度を上げる。"],

["3-3","Function Calling（Tool Use）の説明として適切なものはどれか。",["LLMが外部の関数やツールを呼び出すための仕組み","LLMの重みを更新する仕組み","利用者がプログラミング言語を学ぶ機能","モデルを別の言語に翻訳する機能"],"LLMは「どのツールをどの引数で呼ぶか」を出力し、実行結果を受け取って次の判断に使う。"],
["3-3","AIエージェントの短期メモリと長期メモリの説明として適切なものはどれか。",["短期メモリは現在のタスクや会話の文脈、長期メモリは会話をまたいで保持する情報","短期メモリはCPU、長期メモリはハードディスクそのものを指す","短期メモリは画像、長期メモリは文章だけを保存する","両者は同じものを指す"],"短期メモリは主にコンテキストウィンドウ内の情報。長期メモリは外部に保存し、必要なときに取り出す。"],
["3-3","コンテキストエンジニアリングの説明として適切なものはどれか。",["コンテキストウィンドウに入れる情報を設計・管理し、必要な情報を適切に与える","プロンプトの1文をできるだけ短くする技術","モデルの重みを圧縮する技術","サーバーの台数を増やす技術"],"指示、参照資料、ツールの結果、履歴など、何をいつ与えるかを設計する。プロンプトエンジニアリングより広い考え方。"],
["3-3","AIエージェントのフィードバックループとして適切なものはどれか。",["推論して行動し、結果を観察して、必要なら計画を立て直す","一度立てた計画を結果に関係なく最後まで実行する","人間が毎回すべての手順を入力する","行動せずに推論だけを繰り返す"],"推論 → 行動 → 観察 → 再計画を繰り返すことで、状況に応じてタスクを進める。"],
["3-3","AIエージェントにおけるガードレールの役割はどれか。",["不適切な入力・出力や危険な行動を制限する","処理速度を上げる","コンテキストウィンドウを広げる","学習データを増やす"],"ガードレールは安全に動かすための制約や検査の仕組み。"],
["3-3","構造化出力の説明として適切なものはどれか。",["JSONなど、あらかじめ決めた形式に沿って出力させる","文章を箇条書きで読みやすくするだけの機能","出力を必ず日本語にする","出力を暗号化する"],"決まった形式で出力させることで、後続のプログラムやツールが確実に処理できる。"],
["3-4","MCP（Model Context Protocol）の説明として適切なものはどれか。",["AIと外部のツールやデータソースをつなぐための共通の規格","LLMの学習方法の一つ","画像生成モデルの名称","AIの利用を規制する法律"],"MCPにより、ツールごとに個別の接続を作らなくても、共通の方法で外部と連携できる。"],
["3-4","MCPサーバーの役割として適切なものはどれか。",["ツールやデータをAI側から利用できる形で提供する","LLMの事前学習を行う","利用者の画面を表示する","AIの出力を人間が採点する"],"ファイル、データベース、業務アプリなどの機能をMCPサーバーが提供し、AI側がそれを呼び出す。権限管理が重要。"],
["3-4","A2A（Agent-to-Agent）の説明として適切なものはどれか。",["エージェント同士が連携するためのプロトコル","エージェントとデータベースをつなぐ検索方式","人間とエージェントの承認手続き","エージェントの料金体系"],"MCPがエージェントとツール・データをつなぐのに対し、A2Aはエージェント間の連携を扱う。"],
["3-4","Agent Skills（エージェントスキル）の説明として適切なものはどれか。",["手順や資料、スクリプトなどをまとめ、必要なときに読み込ませて特定の作業をこなせるようにする仕組み","エージェントの利用者が取得する資格","エージェントの処理速度を測る指標","エージェントを停止する緊急ボタン"],"作業の進め方をパッケージ化しておき、該当する作業のときだけ読み込んで使う。"],
["3-4","マルチエージェントの説明として適切なものはどれか。",["役割の異なる複数のエージェントが分担・協調してタスクを進める","1つのエージェントを複数人で同時に使う","複数のLLMを同時に学習させる","エージェントを複数の言語に対応させる"],"全体を取りまとめるエージェントが、個別の作業をサブエージェントに任せる構成が代表的。"],
["3-5","コーディングエージェントの説明として適切なものはどれか。",["コードベースを読み、編集やテストの実行、プルリクエストの作成まで進める","コードの一部を補完するだけで、ファイルは操作できない","プログラミングの試験問題を作る専用ツール","人間が書いたコードを採点するだけのツール"],"コーディングエージェントは複数のファイルにまたがる作業を進められる。最終的なレビューは人間が担う。"],
["3-5","ハーネスエンジニアリングの説明として最も適切なものはどれか。",["エージェントが安定して動くよう、モデルを取り巻くツール・ルール・検証の仕組みなどの環境を設計する","モデルの重みを直接書き換える","プロンプトの文面だけを調整する","サーバーを冷却する設備を設計する"],"プロンプト、コンテキストに続き、モデルの周りの実行環境全体を整える考え方。"],
["3-5","ディープリサーチの説明として適切なものはどれか。",["複数の情報源を横断して調べ、結果をレポートにまとめる","1つのWebページだけを要約する","学習データだけをもとに即答する","社内文書を削除して整理する"],"調査の計画、検索、読み込み、整理をエージェントが繰り返す。出典の確認は人間が行う。"],
["3-6","AIエージェントに権限を与えるときの「最小権限の原則」とはどれか。",["タスクに必要な最小限の権限だけを与える","念のためすべての権限を与える","権限を一切与えずに使う","管理者と同じ権限を与える"],"権限を過剰に与えると、誤動作や攻撃を受けたときの被害が大きくなる。"],
["3-6","プロンプトインジェクションの説明として適切なものはどれか。",["Webページや文書などに仕込まれた悪意のある指示によって、AIに意図しない動作をさせる攻撃","AIの学習データを盗み出す攻撃","サーバーに大量の通信を送りつける攻撃","パスワードを総当たりで試す攻撃"],"エージェントは外部のコンテンツを読むため、そこに埋め込まれた指示に従ってしまう危険がある。"],
["3-6","サンドボックスの説明として適切なものはどれか。",["外部から隔離した環境でエージェントを動かし、影響の範囲を限定する","エージェントに自由に本番環境を操作させる","エージェントの学習データを保管する場所","エージェントの利用料金を管理する画面"],"万一誤った操作をしても、被害が隔離環境の中にとどまるようにする。"],
["3-6","AIエージェントにおける「連鎖的なエラー」とはどれか。",["初期の誤りが後続の工程に引き継がれ、被害が広がること","複数の利用者が同時にエラーを起こすこと","エラーのたびに自動で修正されること","エラーが1件も発生しない状態"],"自律的に複数の工程を進めるため、途中で人が確認する箇所を設けることが重要。"],
["3-6","AIエージェントのEvalの説明として適切なものはどれか。",["性能や安全性を、テストケースを使って体系的に評価する","エージェントの名前を決める","エージェントの料金を見積もる","エージェントを強制終了する"],"導入前の評価に加え、導入後も継続的なモニタリングで挙動を確認する。"],
["3-6","AIエージェントを安全に使うための対応として適切なものを2つ選べ。",["影響の大きい操作の前に人間の承認を挟む","アクセスできる範囲を必要なものに限定する","作業が速くなるよう、あらゆるシステムの管理者権限を与える","操作の記録は取らない"],"最小権限、Human-in-the-Loop、サンドボックス、ホワイトリスト、モニタリングなどを重ねる多層防御が基本。",2],

["4-1","生成AIの出力を業務で使う際の責任の考え方として適切なものはどれか。",["AIは補助者であり、最終的な判断と責任は人間が負う","AIが出した内容の責任はAIの提供会社だけが負う","AIの出力であると明記すれば責任は生じない","責任の所在は誰にもない"],"新シラバス第4章の基本。出力を採用するかどうかを決めた人間・組織が責任を持つ。"],
["4-1","検索エンジンと生成AIの違いとして適切なものはどれか。",["検索エンジンは既存のページを提示し、生成AIは確率的に文章を生成するため、内容や出典が正しいとは限らない","検索エンジンは誤りがあり、生成AIには誤りがない","どちらも常に一次情報を表示する","生成AIは必ず最新の情報をもとに答える"],"生成AIの回答はもっともらしく見えても誤りを含み得る。重要な内容は一次情報で確かめる。"],
["4-1","「AIを使わない判断」に関する説明として適切なものはどれか。",["誤りの影響が大きい場面などでは、あえてAIを使わない選択も適切な判断になる","AIはどんな場面でも必ず使うべきである","AIを使わないことは常に非効率で誤りである","AIを使うかどうかはツールが自動で決める"],"用途と影響度を考え、使ってよい場面・慎重に使う場面・避けるべき場面を見分ける。"],
["4-1","AIの出力を鵜呑みにしてはいけない理由として適切なものを2つ選べ。",["ハルシネーションにより誤った内容が含まれることがある","学習データの偏りが出力に反映されることがある","AIの出力は著作権法で利用が禁止されている","AIの出力は必ず古い情報である"],"誤情報と偏りの両方があり得るため、批判的思考を持って確認する。",2],
["4-2","ハルシネーションの説明として適切なものはどれか。",["事実と異なる内容を、もっともらしく生成してしまう現象","AIが応答しなくなる現象","入力した情報が外部に漏れる現象","生成に時間がかかる現象"],"存在しない判例や統計、出典が作られることもある。ファクトチェックが必要。"],
["4-2","ディープフェイクの説明として適切なものはどれか。",["AIを使い、実在の人物の映像や音声を本物のように合成したもの","深い階層のフォルダに隠したファイル","学習データが足りないモデル","著作権が切れた画像"],"なりすまし、詐欺、偽情報の拡散に悪用されるリスクがある。"],
["4-2","生成AIへの入力による情報漏えいリスクへの対応として適切なものはどれか。",["機密情報や個人情報を、許可されていないAIサービスに入力しない","有名なサービスであれば何を入力してもよい","入力した後に履歴を消せば問題ない","社外秘の資料は要約させる場合に限り入力してよい"],"入力データが学習に使われるか、どこに保存されるかはサービスや設定で異なる。入力可能な情報は社内ルールに従う。"],
["4-2","生成AIがフィッシング詐欺に悪用される例として適切なものはどれか。",["不自然さのない詐欺メールの文面を大量に作る","メールの受信速度を遅くする","パスワードの桁数を増やす","迷惑メールフィルターを強化する"],"文面の不自然さで見抜くことが難しくなっている。多要素認証や送信元の確認などの対策が重要。"],
["4-2","生成AIのバイアスに関する説明として適切なものはどれか。",["学習データに含まれる偏りが出力に反映され、差別的・不公平な内容になることがある","AIは中立なので偏りは生じない","バイアスは画像生成だけの問題である","プロンプトを日本語にすればバイアスはなくなる"],"採用や審査など人に影響する場面では、特に慎重な確認が必要。"],
["4-2","著名人の氏名や肖像が持つ顧客吸引力を無断で利用することで侵害するおそれがある権利はどれか。",["パブリシティ権","特許権","意匠権","同一性保持権"],"パブリシティ権は氏名・肖像の経済的価値に関する権利。肖像権は、みだりに撮影・公表されない人格的な利益に関わる。"],
["4-3","シャドーAIの説明として適切なものはどれか。",["組織が承認していない生成AIツールを、従業員が業務に使うこと","AIが利用者に隠れて学習すること","夜間だけ稼働するAIシステム","AIが作った画像の影の部分"],"会社が把握していないIT機器やサービスの利用をシャドーITといい、そのAI版がシャドーAI。"],
["4-3","シャドーAIが発生する理由として適切なものはどれか。",["業務を効率化したいが、承認されたツールやルールが整っていない","従業員全員が悪意を持っているため","AIツールの利用料が高すぎるため","法律で個人アカウントの利用が義務付けられているため"],"多くは悪意ではなく利便性から起きる。禁止するだけでなく、使える環境とルールを整えることが対策になる。"],
["4-3","シャドーAIに当たる行為はどれか。",["個人で契約した生成AIに、顧客情報を含む資料を入力して要約させる","会社が承認したAIツールを、定められた範囲で使う","AIツールの利用を上司に申請する","公開済みのプレスリリースを承認済みツールで要約する"],"個人アカウントや未承認のブラウザ拡張機能の利用が典型例。"],
["4-3","未承認のAIツールを業務で使うことの危険性として適切なものはどれか。",["組織が利用状況を把握できず、情報漏えいが起きても経緯を追跡しにくい","処理が速くなりすぎて業務が混乱する","AIの回答が必ず間違う","パソコンの電源が入らなくなる"],"誰が何を入力したかを追えること（トレーサビリティ）が失われる。"],
["4-3","従業員が守るべきAI利用ルールとして適切なものはどれか。",["承認済みのツールを使い、入力してよい情報の範囲を守り、出力を確認する","便利なツールを見つけたら、まず業務で試してから報告する","個人アカウントであれば会社のルールは適用されない","出力はAIが作ったものなので確認は不要"],"会社はルールと環境を整え、従業員はそれを守るという、双方の役割がある。"],
["4-4","会社が承認したAIツールでも出力の確認が必要な理由はどれか。",["ツールが安全であることと、出力が正しいことは別の問題だから","承認されたツールは必ず誤った出力をするから","確認しないと利用料金が上がるから","承認は形式的なもので意味がないから"],"承認は主に情報管理上の安全性を確認したもの。誤情報や権利侵害の可能性は残る。"],
["4-4","AI出力の検証レベルの考え方として適切なものはどれか。",["用途と影響度に応じて、確認の深さを変える","すべての出力を同じ手間で確認する","社内向けなら確認は一切不要","確認は専門家だけが行えばよい"],"個人的なアイデア出しと、社外公開や契約に関わる文書とでは、必要な確認の深さが違う。"],
["4-4","ファクトチェックで確認する内容として適切なものはどれか。",["事実・数値・出典・情報の新しさを一次情報で確かめる","文章の読みやすさだけを確かめる","文字数が指定どおりかを確かめる","別のAIに同じ質問をして同じ答えなら正しいとみなす"],"別のAIが同じ答えを返しても正しいとは限らない。公的機関や原典など一次情報に当たる。"],
["4-4","妥当性レビューで確認する内容はどれか。",["前提が適切か、論理が通っているか、抜け漏れがないか","誤字脱字がないか","画像の解像度が十分か","出力が何秒で返ってきたか"],"個々の事実が正しくても、前提や結論の導き方が誤っていることがある。"],
["4-4","AIの出力に対する採否の判断として、シラバスで挙げられている選択肢の組み合わせはどれか。",["採用・修正・破棄・専門家確認","採用・保留・削除・再生成","承認・却下・差し戻し・公開","保存・共有・印刷・削除"],"確認の結果、そのまま使う、直して使う、使わない、専門家に確認する、のいずれかを人が判断する。"],
["4-5","個人情報保護法における個人情報の説明として適切なものはどれか。",["生存する個人に関する情報で、特定の個人を識別できるもの","亡くなった人を含むすべての人に関する情報","企業の売上や技術に関する情報","氏名が書かれていない情報はすべて対象外"],"他の情報と容易に照合して個人を識別できるものも含まれる。"],

["4-5","仮名加工情報と匿名加工情報の違いとして適切なものはどれか。",["仮名加工情報は他の情報と照合しない限り個人を識別できないよう加工したもの、匿名加工情報は個人を識別できず復元もできないよう加工したもの","仮名加工情報は氏名をひらがなにしたもの、匿名加工情報は氏名を消したもの","どちらも加工すれば個人情報保護法の対象から完全に外れる","両者は同じものの別名"],"加工したからといって自由にAIへ入力できるわけではない。扱いのルールは種類ごとに定められている。"],

["4-6","日本の著作権法におけるAI学習と著作物の関係として適切なものはどれか。",["情報解析を目的とする利用は原則として許諾なく行えるが、著作権者の利益を不当に害する場合は除かれる","著作物をAIの学習に使うことは一切禁止されている","著作物はどのような態様でも無制限に学習へ利用できる","学習には必ず著作権者への登録料の支払いが必要"],"著作権法第30条の4（権利制限規定）による。学習段階と、生成・利用段階は分けて考える。"],

<script>
const $=s=>document.querySelector(s), view=$("#view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="gaip-v1";
let store={s:{},t:{}};
try{const r=localStorage.getItem(KEY);if(r)store=Object.assign(store,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const QS=Q.map((a,i)=>({i,sec:a[0],ch:+a[0][0],q:a[1],c:a[2],exp:a[3],n:a[4]||1,id:a[0]+":"+a[1].slice(0,16)}));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stat=(list)=>{let ok=0,tried=0;for(const q of list){const s=store.s[q.id];if(s){tried++;if(s.l)ok++}}return{ok,tried,total:list.length}};
const byCh=c=>QS.filter(q=>q.ch===c), bySec=s=>QS.filter(q=>q.sec===s);
const wrongs=()=>QS.filter(q=>store.s[q.id]&&!store.s[q.id].l);
const ABC=["ア","イ","ウ","エ"];
let ses=null, tick=null, ui={drillCh:0,drillSec:"",drillN:10,termCh:0,termMode:"card",termIdx:0,termFlip:false,confirm:false,resetAsk:false};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}

/* ---------- セッション ---------- */
function start(mode,list,minutes){
  ses={mode,idx:0,done:false,items:list.map(q=>({q,order:shuffle([0,1,2,3]),pick:[],answered:false})),endAt:minutes?Date.now()+minutes*60000:0,from:location.hash||"#home"};
  ui.confirm=false; clearInterval(tick);
  if(minutes)tick=setInterval(()=>{if(!ses||ses.done)return clearInterval(tick);const el=$("#timer");const left=ses.endAt-Date.now();if(left<=0){finish();return}if(el)el.textContent=fmt(left)},500);
  render(); window.scrollTo(0,0);
}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const isRight=it=>it.pick.length===it.q.n&&it.pick.every(p=>p<it.q.n);
function record(it){const s=store.s[it.q.id]||{c:0,w:0,l:0};const r=isRight(it);r?s.c++:s.w++;s.l=r?1:0;store.s[it.q.id]=s}
function finish(){clearInterval(tick);for(const it of ses.items){if(ses.mode==="mock"){it.answered=true;record(it)}}save();ses.done=true;render();window.scrollTo(0,0)}
function mockSet(n){const per=n===60?[0,10,12,12,16,10]:[0,3,4,4,6,3];let out=[];for(let c=1;c<=5;c++)out=out.concat(shuffle(byCh(c)).slice(0,per[c]));return shuffle(out)}

function askText(q){return "生成AIパスポート試験（2027年2月からの新シラバス）の勉強をしています。次の問題について、正解の理由と、他の選択肢が違う理由を初心者向けに説明してください。\n\n【第"+q.ch+"章 "+CH[q.ch]+"／"+SECS[q.sec]+"】\n問題："+q.q+"\n選択肢：\n"+q.c.map(x=>"・"+x).join("\n")+"\n正解："+q.c.slice(0,q.n).join("／")+"\n解説："+q.exp}
function copyAsk(q,box){const t=askText(q);const fb=()=>{box.innerHTML='<textarea id="askta" readonly>'+esc(t)+'</textarea><p class="mute">上の文章をコピーして、Claudeに貼り付けてください。</p>';$("#askta").select()};
  try{navigator.clipboard.writeText(t).then(()=>toast("コピーしました。Claudeに貼り付けて質問できます"),fb)}catch(e){fb()}}

/* ---------- 画面 ---------- */
function renderQuiz(){
  const it=ses.items[ses.idx],q=it.q,mock=ses.mode==="mock",multi=q.n>1,show=!mock&&it.answered;
  let h='<section class="sheet"><div class="qhead"><span>'+(mock?"模擬試験":"ドリル")+" "+(ses.idx+1)+" / "+ses.items.length+'</span><span>第'+q.ch+"章 "+esc(SECS[q.sec])+"</span>"+(ses.endAt?'<span class="timer" id="timer">'+fmt(ses.endAt-Date.now())+"</span>":"")+"</div>";
  h+='<p class="qtext">'+esc(q.q)+"</p>"+(multi?'<p class="mute">2つ選んでください。</p>':"")+'<div class="opts">';
  it.order.forEach((o,k)=>{let cls="opt";if(show){if(o<q.n)cls+=" good";else if(it.pick.includes(o))cls+=" bad"}else if(it.pick.includes(o))cls+=" sel";
    h+='<button class="'+cls+'" data-act="pick" data-o="'+o+'"'+(show?" disabled":"")+' aria-pressed="'+it.pick.includes(o)+'"><em>'+ABC[k]+"</em><span>"+esc(q.c[o])+"</span></button>"});
  h+="</div>";
  if(!mock){
    if(show){const r=isRight(it);h+='<p class="verdict '+(r?"ok":"ng")+'">'+(r?"正解":"不正解")+'</p><p class="exp">'+esc(q.exp)+'</p><div class="row"><button class="btn" data-act="next">'+(ses.idx+1<ses.items.length?"次の問題":"結果を見る")+'</button><button class="btn ghost" data-act="ask">Claudeに質問する文をコピー</button><a class="btn ghost" href="https://claude.ai/new" target="_blank" rel="noopener">Claudeを開く</a></div><div id="askbox"></div>'}
    else if(multi)h+='<div class="row"><button class="btn" data-act="submit"'+(it.pick.length===q.n?"":" disabled")+">回答する</button></div>";
    h+='<div class="row"><button class="btn ghost" data-act="quit">中断して結果を見る</button></div>';
  }else{
    const un=ses.items.filter(x=>!x.pick.length).length;
    h+='<div class="row"><button class="btn ghost" data-act="prev"'+(ses.idx?"":" disabled")+'>前へ</button><button class="btn" data-act="mnext"'+(ses.idx+1<ses.items.length?"":" disabled")+'>次へ</button><button class="btn ghost" data-act="grade">'+(ui.confirm?"採点を確定する（未回答 "+un+" 問）":"採点する")+"</button></div>";
    h+='<div class="grid60">'+ses.items.map((x,k)=>'<button data-act="jump" data-k="'+k+'" class="'+(x.pick.length?"ans ":"")+(k===ses.idx?"cur":"")+'">'+(k+1)+"</button>").join("")+"</div>";
  }
  view.innerHTML=h+"</section>";
}
function renderResult(){
  const done=ses.items.filter(x=>x.answered),right=done.filter(isRight).length,pct=done.length?Math.round(right/done.length*100):0;
  let h='<section class="sheet"><span class="lab">'+(ses.mode==="mock"?"模擬試験の結果":"ドリルの結果")+'</span><p class="score">'+right+" / "+done.length+'<span style="font-size:20px"> 問　'+pct+"%</span></p>";
  if(ses.mode==="mock")h+='<p class="mute">'+(pct>=80?"8割を超えています。この調子で苦手な項目を埋めていきましょう。":"目安の8割に届いていません。下の章別の結果から、弱い章を章別ドリルで補いましょう。")+" 合格基準は公表されていないため、8割は余裕を持たせた目安です。</p>";
  for(let c=1;c<=5;c++){const l=done.filter(x=>x.q.ch===c);if(!l.length)continue;const r=l.filter(isRight).length;h+='<div class="chrow" style="--sc:var(--c'+c+')"><span>第'+c+"章 "+CH[c]+"</span><small>"+r+"/"+l.length+'</small><div class="bar"><b style="width:'+(r/l.length*100)+'%"></b></div></div>'}
  h+='<div class="row"><a class="btn" href="#home" data-act="close">ホームへ</a><a class="btn ghost" href="#review" data-act="close">間違えた問題を復習</a></div></section>';
  h+='<section class="sheet"><h2>解答と解説</h2><div>'+done.map((it,k)=>{const r=isRight(it);return "<details"+(r?"":" open")+'><summary><b class="verdict '+(r?"ok":"ng")+'">'+(r?"○":"×")+"</b> "+esc(it.q.q)+"</summary><div><span>正解："+esc(it.q.c.slice(0,it.q.n).join("／"))+"</span>"+(r?"":"<span>あなたの回答："+(it.pick.length?esc(it.pick.map(p=>it.q.c[p]).join("／")):"未回答")+"</span>")+'<span class="exp">'+esc(it.q.exp)+"</span></div></details>"}).join("")+"</div></section>";
  view.innerHTML=h;
}
function vHome(){
  const all=stat(QS),days=Math.ceil((new Date(2027,1,1)-new Date())/864e5);
  let h='<section class="sheet"><span class="lab">Generative AI Passport / 2027年2月試験からの新シラバス対応</span><h1>5つの章に、合格のスタンプを。</h1><p class="mute">章ごとに直近の正答が8割を超えるとスタンプが押されます。オリジナル問題 '+QS.length+" 問と用語 "+T.length+' 語で、全32の中項目を一通り押さえられます。</p><div class="stamps">';
  const rot=[-7,5,-3,8,-5];
  for(let c=1;c<=5;c++){const s=stat(byCh(c)),p=Math.round(s.ok/s.total*100);h+='<button class="stamp'+(p>=80?" on":"")+'" data-act="goch" data-c="'+c+'" style="--sc:var(--c'+c+");--rot:"+rot[c-1]+'deg"><i><small>CHAPTER</small><b>'+c+"</b><small>"+p+"%</small></i><span>"+CH[c]+"</span></button>"}
  h+='</div><div class="row"><a class="btn" href="#drill">章別ドリルを始める</a><a class="btn ghost" href="#mock">模擬試験</a></div><p class="mrz">P&lt;GAI&lt;&lt;SEISEI&lt;AI&lt;PASSPORT&lt;&lt;&lt;'+String(all.tried).padStart(3,"0")+"OF"+QS.length+"&lt;"+String(all.ok).padStart(3,"0")+"OK&lt;&lt;&lt;</p></section>";
  h+='<section class="sheet"><h2>試験のあらまし</h2><div class="facts"><div><span class="lab">問題数・時間</span><strong>60問・60分</strong></div><div><span class="lab">形式</span><strong>四肢択一</strong><span class="mute">一部は複数選択</span></div><div><span class="lab">受験方法</span><strong>オンライン</strong><span class="mute">IBT方式</span></div><div><span class="lab">受験料</span><strong>11,000円</strong><span class="mute">税込・学生5,500円</span></div><div><span class="lab">次回の受験期間</span><strong>2027年2月1日〜28日</strong><span class="mute">'+(days>0?"開始まであと"+days+"日":"受験期間中または終了")+'</span></div><div><span class="lab">申込締切</span><strong>2027年1月31日</strong></div></div><p class="mute">日程と料金は2026年11月時点のGUGA公式サイトの内容です。申込前に<a href="https://guga.or.jp/outline/" target="_blank" rel="noopener">公式サイト</a>で確かめてください。</p></section>';
  h+='<section class="sheet"><h2>この問題集について</h2><p class="mute">問題は公式シラバス（2027年2月試験より適用）の中項目とキーワードをもとに作ったオリジナル問題で、過去問ではありません。改訂版の公式テキストとは言い回しが違うことがあります。解説で分からない点は、各問題の「Claudeに質問する文をコピー」から質問できます。</p><div class="row"><button class="btn ghost" data-act="reset">'+(ui.resetAsk?"本当に学習記録を消す":"学習記録をリセット")+"</button></div></section>";
  view.innerHTML=h;
}
function vDrill(){
  const pool=ui.drillSec?bySec(ui.drillSec):ui.drillCh?byCh(ui.drillCh):QS,s=stat(pool);
  let h='<section class="sheet"><h1>章別ドリル</h1><p class="mute">1問ごとに正誤と解説が出ます。まだ解いていない問題と、前回間違えた問題が先に出ます。</p><span class="lab">章</span><div class="row">';
  for(let c=0;c<=5;c++)h+='<button class="chip" data-act="dch" data-c="'+c+'" aria-pressed="'+(ui.drillCh===c)+'">'+(c?"第"+c+"章":"全章")+"</button>";
  h+="</div>";
  if(ui.drillCh){h+='<label class="lab" for="secsel">中項目</label><select id="secsel"><option value="">第'+ui.drillCh+"章 "+CH[ui.drillCh]+"（すべて）</option>"+Object.keys(SECS).filter(k=>+k[0]===ui.drillCh).map(k=>'<option value="'+k+'"'+(ui.drillSec===k?" selected":"")+">"+SECS[k]+"</option>").join("")+"</select>"}
  h+='<span class="lab">出題数</span><div class="row">'+[5,10,20,0].map(n=>'<button class="chip" data-act="dn" data-n="'+n+'" aria-pressed="'+(ui.drillN===n)+'">'+(n||"すべて")+(n?"問":"")+"</button>").join("")+'</div><p class="mute">対象 '+pool.length+" 問　解いた問題 "+s.tried+"　直近正解 "+s.ok+'</p><div class="row"><button class="btn" data-act="dstart">始める</button></div></section>';
  view.innerHTML=h;
}
function vMock(){
  view.innerHTML='<section class="sheet"><h1>模擬試験</h1><p class="mute">本番と同じ60問・60分。途中では正誤が出ず、最後にまとめて採点します。章ごとの出題数は公表されていないため、シラバスの分量に合わせて 10・12・12・16・10 問で出題します。</p><div class="row"><button class="btn" data-act="mock" data-n="60">60問・60分で始める</button><button class="btn ghost" data-act="mock" data-n="20">ミニ模試 20問・20分</button></div></section>';
}
function termList(){return ui.termCh?T.filter(t=>t[0]===ui.termCh):T}
function vTerms(){
  const list=termList();if(ui.termIdx>=list.length)ui.termIdx=0;
  const known=list.filter(t=>store.t[t[1]]).length;
  let h='<section class="sheet"><h1>用語カード</h1><div class="row">';
  for(let c=0;c<=5;c++)h+='<button class="chip" data-act="tch" data-c="'+c+'" aria-pressed="'+(ui.termCh===c)+'">'+(c?"第"+c+"章":"全章")+"</button>";
  h+='</div><div class="row"><button class="chip" data-act="tmode" data-m="card" aria-pressed="'+(ui.termMode==="card")+'">カード</button><button class="chip" data-act="tmode" data-m="list" aria-pressed="'+(ui.termMode==="list")+'">一覧</button><span class="mute">覚えた '+known+" / "+list.length+"</span></div></section>";
  if(ui.termMode==="card"){const t=list[ui.termIdx];
    h+='<section class="sheet card" data-act="flip" tabindex="0" role="button" style="--sc:var(--c'+t[0]+')"><span class="lab">第'+t[0]+"章　"+(ui.termIdx+1)+" / "+list.length+(store.t[t[1]]?"　覚えた":"")+'</span><p class="term">'+esc(t[1])+"</p>"+(ui.termFlip?"<p>"+esc(t[2])+"</p>":'<p class="mute">タップして説明を見る</p>')+"</section>";
    h+='<div class="row"><button class="btn ghost" data-act="tprev">前へ</button><button class="btn ghost" data-act="tk" data-v="0">まだ</button><button class="btn" data-act="tk" data-v="1">覚えた</button></div>';
  }else h+='<section class="sheet"><dl>'+list.map(t=>"<div><dt>"+esc(t[1])+(store.t[t[1]]?' <span class="lab">覚えた</span>':"")+"</dt><dd>"+esc(t[2])+"</dd></div>").join("")+"</dl></section>";
  view.innerHTML=h;
}
function vReview(){
  const w=wrongs();
  let h='<section class="sheet"><h1>復習</h1>';
  if(!w.length)h+='<p class="mute">前回間違えた問題はありません。ドリルや模擬試験で間違えた問題が、ここにたまります。正解すると外れます。</p><div class="row"><a class="btn" href="#drill">章別ドリルへ</a></div></section>';
  else{h+='<p class="mute">直近の回答が不正解だった問題が '+w.length+' 問あります。</p><div class="row"><button class="btn" data-act="rstart">'+Math.min(w.length,20)+'問を解き直す</button></div></section><section class="sheet"><div>'+w.map(q=>"<details><summary>"+esc(q.q)+'</summary><div><span class="lab">第'+q.ch+"章 "+esc(SECS[q.sec])+"</span><span>正解："+esc(q.c.slice(0,q.n).join("／"))+'</span><span class="exp">'+esc(q.exp)+"</span></div></details>").join("")+"</div></section>"}
  view.innerHTML=h;
}
function vSyl(){
  let h='<section class="sheet"><h1>出題範囲</h1><p class="mute">2027年2月試験から適用される新シラバスの5章・32中項目です。項目をタップすると、その項目だけのドリルが始まります。数字は直近正解数／問題数です。</p></section>';
  for(let c=1;c<=5;c++){const s=stat(byCh(c));h+='<section class="sheet" style="--sc:var(--c'+c+')"><div class="chrow"><h2>第'+c+"章 "+CH[c]+"</h2><small>"+s.ok+"/"+s.total+'</small><div class="bar"><b style="width:'+(s.ok/s.total*100)+'%"></b></div></div><div class="seclist">'+Object.keys(SECS).filter(k=>+k[0]===c).map(k=>{const t=stat(bySec(k));return '<button class="sec" style="background:none;border-width:1px 0 0;text-align:left" data-act="sec" data-s="'+k+'"><span>'+SECS[k]+"</span><small>"+t.ok+"/"+t.total+"</small></button>"}).join("")+"</div></section>"}
  view.innerHTML=h;
}
const VIEWS={home:vHome,drill:vDrill,mock:vMock,terms:vTerms,review:vReview,syllabus:vSyl};
function render(){
  const name=(location.hash||"#home").slice(1),v=VIEWS[name]?name:"home";
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("href")==="#"+v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(ses)return ses.done?renderResult():renderQuiz();
  VIEWS[v]();
}
function prioritized(pool){const rank=q=>{const s=store.s[q.id];return !s?0:s.l?2:1};return shuffle(pool).sort((a,b)=>rank(a)-rank(b))}

document.addEventListener("click",e=>{
  const navA=e.target.closest("#nav a");
  if(navA&&ses){if(ses.mode==="mock"&&!ses.done){e.preventDefault();toast("模擬試験の途中です。「採点する」で終了できます");return}ses=null;clearInterval(tick);if(navA.getAttribute("href")===location.hash)render();return}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,it=ses&&ses.items[ses.idx];
  if(a!=="grade")ui.confirm=false; if(a!=="reset")ui.resetAsk=false;
  switch(a){
    case "pick":{const o=+b.dataset.o,multi=it.q.n>1;
      if(multi){it.pick=it.pick.includes(o)?it.pick.filter(x=>x!==o):it.pick.length<it.q.n?it.pick.concat(o):it.pick}
      else{it.pick=[o];if(ses.mode==="drill"){it.answered=true;record(it);save()}}
      break}
    case "submit":it.answered=true;record(it);save();break;
    case "next":if(ses.idx+1<ses.items.length){ses.idx++;window.scrollTo(0,0)}else{ses.done=true;window.scrollTo(0,0)}break;
    case "quit":ses.done=true;break;
    case "prev":ses.idx--;break; case "mnext":ses.idx++;break; case "jump":ses.idx=+b.dataset.k;break;
    case "grade":if(ui.confirm){finish();return}ui.confirm=true;break;
    case "ask":copyAsk(it.q,$("#askbox"));return;
    case "close":ses=null;clearInterval(tick);if(b.getAttribute("href")===location.hash)break;return;
    case "goch":ui.drillCh=+b.dataset.c;ui.drillSec="";location.hash="#drill";return;
    case "dch":ui.drillCh=+b.dataset.c;ui.drillSec="";break;
    case "dn":ui.drillN=+b.dataset.n;break;
    case "dstart":{const pool=prioritized(ui.drillSec?bySec(ui.drillSec):ui.drillCh?byCh(ui.drillCh):QS);start("drill",ui.drillN?pool.slice(0,ui.drillN):pool);return}
    case "sec":start("drill",prioritized(bySec(b.dataset.s)));return;
    case "rstart":start("drill",shuffle(wrongs()).slice(0,20));return;
    case "mock":start("mock",mockSet(+b.dataset.n),+b.dataset.n);return;
    case "tch":ui.termCh=+b.dataset.c;ui.termIdx=0;ui.termFlip=false;break;
    case "tmode":ui.termMode=b.dataset.m;break;
    case "flip":ui.termFlip=!ui.termFlip;break;
    case "tprev":{const n=termList().length;ui.termIdx=(ui.termIdx-1+n)%n;ui.termFlip=false;break}
    case "tk":{const l=termList();store.t[l[ui.termIdx][1]]=+b.dataset.v;save();ui.termIdx=(ui.termIdx+1)%l.length;ui.termFlip=false;break}
    case "reset":if(ui.resetAsk){store={s:{},t:{}};save();ui.resetAsk=false;toast("学習記録を消しました")}else ui.resetAsk=true;break;
  }
  render();
});
document.addEventListener("change",e=>{if(e.target.id==="secsel"){ui.drillSec=e.target.value;render()}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".card")){e.preventDefault();ui.termFlip=!ui.termFlip;render()}});
window.addEventListener("hashchange",render);
render();
</script>

</body></html>
